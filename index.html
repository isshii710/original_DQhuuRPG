<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- PeerJS: P2P通信ライブラリ（完全無料・サーバー不要） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>天星の冒険譚 オンライン</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Serif+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#FFD700;--gold2:#FFA500;--blue:#1a3a6a;--blue2:#0d2244;--blue3:#061528;
  --white:#ffffff;--red:#cc2200;--green:#00aa44;
  --win-bg:rgba(8,16,44,0.97);--win-bd:#3a5a99;--text:#ffffff;--text2:#ccddf0;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;}
body{background:#000;overflow:hidden;width:100vw;height:100vh;font-family:'DotGothic16',serif;color:var(--white);}

/* ========== CANVAS ========== */
#game-canvas{display:block;width:100%;height:100%;image-rendering:pixelated;}
#canvas-wrap{position:fixed;inset:0;background:#000;}

/* ========== HUD ========== */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;}

#party-hud{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:3px;}
.hud-card{
  background:rgba(8,16,60,0.95);border:1px solid rgba(60,90,180,0.7);
  border-radius:3px;padding:4px 8px;display:flex;align-items:center;gap:6px;min-width:140px;
}
.hud-icon{font-size:14px;width:18px;text-align:center;}
.hud-bars{flex:1;}
.hud-name{font-size:9px;color:var(--white);letter-spacing:1px;margin-bottom:2px;}
.bar-row{display:flex;align-items:center;gap:3px;margin-bottom:1px;}
.bar-lbl{font-size:7px;width:12px;color:var(--white);}
.bar-track{flex:1;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;}
.bar-hp{height:100%;background:linear-gradient(90deg,#ee4444,#ff8844);border-radius:2px;transition:width .2s;}
.bar-mp{height:100%;background:linear-gradient(90deg,#4488ee,#88aaff);border-radius:2px;transition:width .2s;}
.hud-lv{font-size:8px;color:var(--gold);white-space:nowrap;}

#map-label{
  position:absolute;top:8px;left:50%;transform:translateX(-50%);
  background:rgba(6,12,36,0.85);border:1px solid rgba(60,90,160,0.5);
  border-radius:3px;padding:4px 14px;font-size:11px;letter-spacing:2px;color:var(--gold);
  white-space:nowrap;
}

#chatbox{
  position:absolute;bottom:130px;left:8px;right:8px;
  display:flex;flex-direction:column;gap:2px;
}
.chat-line{
  background:rgba(6,12,36,0.8);border:1px solid rgba(60,90,160,0.25);
  border-radius:2px;padding:2px 8px;font-size:10px;
  animation:cfade 6s forwards;
}
@keyframes cfade{0%{opacity:1}80%{opacity:1}100%{opacity:0}}
.chat-sys{color:#88ccff;font-style:italic;}
.chat-name{color:var(--gold);}

/* ========== CONTROLS ========== */
#controls{
  position:fixed;bottom:0;left:0;right:0;height:120px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;z-index:20;pointer-events:none;
}

/* Joystick */
#joy-wrap{width:110px;height:110px;pointer-events:all;position:relative;}
#joy-base{
  width:100%;height:100%;border-radius:50%;
  background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.18);
  position:relative;
}
#joy-knob{
  position:absolute;width:42px;height:42px;border-radius:50%;
  background:rgba(255,255,255,0.22);border:2px solid rgba(255,255,255,0.45);
  top:50%;left:50%;transform:translate(-50%,-50%);
  box-shadow:0 0 10px rgba(255,255,255,0.1);
}

/* Right buttons */
#right-btns{display:flex;flex-direction:column;gap:6px;pointer-events:all;}
.act-row{display:flex;gap:6px;}
.act-btn{
  background:rgba(20,40,100,0.85);border:1px solid rgba(60,90,160,0.5);
  border-radius:4px;color:var(--white);font-family:'DotGothic16',serif;
  font-size:11px;letter-spacing:1px;padding:8px 10px;cursor:pointer;
  transition:all .08s;white-space:nowrap;pointer-events:all;
}
.act-btn:active{background:rgba(60,100,200,0.85);transform:scale(.95);}
.btn-chat{background:rgba(10,50,30,0.85);border-color:rgba(40,150,80,0.5);}
.btn-menu{background:rgba(50,20,80,0.85);border-color:rgba(130,60,200,0.5);}

/* ========== WIN SYSTEM ========== */
.win{
  background:var(--win-bg);border:2px solid var(--win-bd);border-radius:4px;
  box-shadow:0 0 0 1px rgba(80,120,255,0.15),inset 0 1px 0 rgba(255,255,255,0.04),0 8px 40px rgba(0,0,0,0.8);
  position:relative;color:var(--white);
}
.win::before{content:'';position:absolute;inset:2px;border:1px solid rgba(80,120,255,0.1);border-radius:2px;pointer-events:none;}
.win-title{padding:10px 16px;font-family:'Noto Serif JP',serif;font-size:14px;font-weight:700;color:var(--gold);letter-spacing:2px;border-bottom:1px solid var(--win-bd);text-align:center;}
.win-close{padding:10px;text-align:center;cursor:pointer;font-size:11px;color:var(--white);border-top:1px solid rgba(60,90,160,0.3);transition:background .1s;}
.win-close:active{background:rgba(255,50,50,0.1);}

/* ========== SCREENS ========== */
.screen{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;}
.screen.hidden{display:none!important;}

/* Title */
#title-screen{background:radial-gradient(ellipse at 50% 30%,#0d2244,#020810);overflow:hidden;}
.title-stars{position:absolute;inset:0;pointer-events:none;}
.tstar{position:absolute;border-radius:50%;background:#fff;animation:twink var(--d) ease-in-out infinite alternate;}
@keyframes twink{0%{opacity:.1}100%{opacity:.9}}
.title-logo{text-align:center;margin-bottom:28px;position:relative;z-index:1;}
.title-dq{font-size:clamp(13px,3.5vw,22px);color:var(--gold2);letter-spacing:6px;text-shadow:0 0 20px rgba(255,165,0,.4);margin-bottom:6px;}
.title-main{font-family:'Noto Serif JP',serif;font-size:clamp(32px,9vw,64px);font-weight:900;background:linear-gradient(180deg,#fff9c4,#ffd700 40%,#b8860b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 24px rgba(255,215,0,.4));line-height:1.1;}
.title-ix{font-family:'Noto Serif JP',serif;font-size:clamp(18px,5vw,40px);font-weight:900;color:var(--gold);letter-spacing:8px;text-shadow:0 0 16px rgba(255,215,0,.4);}
.title-sub{font-size:10px;letter-spacing:3px;color:rgba(255,200,100,.4);margin-top:6px;}
.title-menu{display:flex;flex-direction:column;gap:6px;width:220px;position:relative;z-index:1;}
.tmenu-btn{
  background:linear-gradient(180deg,rgba(28,56,120,.9),rgba(10,24,58,.9));
  border:1px solid var(--win-bd);color:var(--white);font-family:'DotGothic16',serif;
  font-size:15px;padding:11px 20px;text-align:left;cursor:pointer;border-radius:2px;
  transition:all .1s;display:flex;align-items:center;gap:8px;
}
.tmenu-btn:active,.tmenu-btn:hover{background:linear-gradient(180deg,rgba(60,100,200,.9),rgba(28,60,150,.9));border-color:var(--gold);color:var(--gold);transform:translateX(4px);}
.tmenu-arrow{color:var(--gold);font-size:11px;}

#lobby-screen{background:radial-gradient(ellipse at 50% 0%,#0d2244,#020810);align-items:center;justify-content:flex-start;padding:12px 8px 24px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.lobby-box{width:min(400px,98vw);flex-shrink:0;}
.lfield{margin-bottom:12px;}
.lfield label{display:block;font-size:10px;color:var(--white);letter-spacing:2px;margin-bottom:4px;}
.linput{width:100%;background:rgba(10,20,70,.9);border:1px solid var(--win-bd);color:var(--white);font-family:'DotGothic16',serif;font-size:16px;padding:9px 12px;border-radius:2px;outline:none;}
.linput:focus{border-color:var(--gold);}

/* Party builder — no max-height, just natural flow */
.party-builder{display:flex;flex-direction:column;gap:4px;}
.party-slot{background:rgba(10,20,60,.85);border:1px solid rgba(60,90,180,.55);border-radius:3px;padding:6px 8px;}
.party-slot-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.slot-num{font-size:10px;color:var(--gold);letter-spacing:1px;width:30px;flex-shrink:0;}
.slot-name-in{flex:1;background:rgba(10,20,70,.9);border:1px solid rgba(60,90,180,.5);color:var(--white);font-family:'DotGothic16',serif;font-size:16px;padding:4px 8px;border-radius:2px;outline:none;}
.slot-name-in:focus{border-color:var(--gold);}
.slot-toggle{font-size:10px;color:var(--white);cursor:pointer;padding:4px 8px;border:1px solid rgba(60,90,160,.5);border-radius:2px;background:rgba(10,20,60,.7);}
.class-row{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;}
.cls-btn{background:rgba(10,20,60,.85);border:1px solid rgba(60,90,180,.5);border-radius:3px;padding:4px 2px;cursor:pointer;text-align:center;transition:all .1s;}
.cls-btn.sel{border-color:var(--gold);background:rgba(30,60,140,.95);}
.cls-icon{font-size:16px;display:block;}
.cls-name{font-size:8px;color:var(--white);letter-spacing:1px;margin-top:1px;}
.cls-btn.sel .cls-name{color:var(--gold);}

.room-box{background:rgba(20,40,80,.7);border:1px solid rgba(255,215,0,.4);border-radius:4px;padding:10px;text-align:center;margin-bottom:10px;}
.room-code-disp{font-size:30px;font-weight:900;color:var(--gold);letter-spacing:8px;text-shadow:0 0 10px rgba(255,215,0,.3);}
.room-hint{font-size:9px;color:var(--white);margin-top:3px;letter-spacing:1px;}
.party-member-list{display:flex;flex-direction:column;gap:4px;min-height:40px;}
.pmember{background:rgba(10,20,60,.8);border:1px solid rgba(60,90,180,.4);border-radius:3px;padding:6px 10px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--white);}
.pmember .dot{width:6px;height:6px;border-radius:50%;background:#00ff88;box-shadow:0 0 4px #00ff88;flex-shrink:0;}

.btn-prim{background:linear-gradient(180deg,#4477ff,#1133cc);border:1px solid #6699ff;color:#fff;font-family:'DotGothic16',serif;font-size:14px;padding:11px;border-radius:2px;cursor:pointer;text-align:center;letter-spacing:1px;margin-bottom:6px;transition:all .1s;}
.btn-prim:active{transform:scale(.98);}
.btn-sec{background:rgba(10,20,60,.85);border:1px solid var(--win-bd);color:var(--white);font-family:'DotGothic16',serif;font-size:12px;padding:9px;border-radius:2px;cursor:pointer;text-align:center;transition:all .1s;}
.btn-sec:active{transform:scale(.98);}
.lobby-body{padding:16px;display:flex;flex-direction:column;gap:10px;}

/* ========== BATTLE SCREEN ========== */
#battle-screen{
  position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;
}
#battle-screen.hidden{display:none;}
#battle-bg{
  flex:1;min-height:0;position:relative;overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;
}
.battle-field-top{flex:1;display:flex;justify-content:center;align-items:center;gap:20px;padding:16px 12px 8px;flex-wrap:wrap;}
.battle-field-bot{display:flex;justify-content:center;align-items:flex-end;gap:12px;padding:0 12px 12px;flex-shrink:0;}

/* Enemy sprite */
.battle-enemy{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;}
.battle-enemy.dead{opacity:0;pointer-events:none;transition:opacity .4s;}
.b-ehp{width:64px;height:5px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden;}
.b-ehp-fill{height:100%;background:linear-gradient(90deg,#ff3333,#ff8833);border-radius:2px;transition:width .25s;}
.b-ename{font-size:8px;color:var(--white);letter-spacing:1px;}
.enemy-spr{cursor:pointer;display:block;image-rendering:pixelated;transition:transform .08s;}

/* Ally battle */
.battle-ally{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;}
.battle-ally.dead{opacity:.25;}
.ally-spr{font-size:28px;display:block;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5));}
.ally-name-tag{font-size:8px;color:var(--white);letter-spacing:1px;}

/* Battle animations */
@keyframes playerAttack{
  0%{transform:translateX(0)}
  30%{transform:translateX(60px) scaleX(1.1)}
  50%{transform:translateX(55px)}
  100%{transform:translateX(0)}
}
@keyframes enemyAttack{
  0%{transform:translateX(0)}
  30%{transform:translateX(-50px) scaleX(1.1)}
  50%{transform:translateX(-45px)}
  100%{transform:translateX(0)}
}
@keyframes hitShake{
  0%{transform:translateX(0)}25%{transform:translateX(-6px) brightness(3)}
  50%{transform:translateX(6px)}75%{transform:translateX(-4px)}100%{transform:translateX(0)}
}
@keyframes enemyHit{
  0%{filter:brightness(3) drop-shadow(0 0 8px #fff);transform:translateX(0)}
  25%{transform:translateX(-8px)}
  50%{filter:brightness(2);transform:translateX(8px)}
  75%{transform:translateX(-4px)}
  100%{filter:brightness(1) drop-shadow(0 3px 6px rgba(0,0,0,.5));transform:translateX(0)}
}
.anim-player-attack{animation:playerAttack .45s ease-in-out forwards!important;}
.anim-enemy-attack{animation:enemyAttack .45s ease-in-out forwards!important;}
.anim-hit{animation:hitShake .3s ease-in-out!important;}
.anim-enemy-hit{animation:enemyHit .35s ease-in-out!important;}

/* Battle window */
#battle-win{
  flex-shrink:0;border-radius:0;border-left:none;border-right:none;border-bottom:none;
  border-top:2px solid var(--win-bd);
}
#battle-msg{padding:10px 14px;min-height:50px;font-size:13px;line-height:1.7;letter-spacing:1px;border-bottom:1px solid rgba(60,90,160,.2);}
#battle-cmds{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(60,90,160,.12);}
.bcmd{background:var(--win-bg);border:none;color:var(--white);font-family:'DotGothic16',serif;font-size:12px;padding:10px 4px;cursor:pointer;transition:background .06s;letter-spacing:1px;text-align:center;}
.bcmd:active,.bcmd.sel{background:rgba(50,90,200,.6);color:var(--gold);}
.bcmd:disabled{color:rgba(255,255,255,.2);cursor:not-allowed;}
#battle-party{display:flex;gap:6px;padding:7px 12px;border-top:1px solid rgba(60,90,160,.2);overflow-x:auto;}
.bpc{background:rgba(10,20,60,.8);border:1px solid rgba(60,90,180,.4);border-radius:3px;padding:5px 9px;flex-shrink:0;min-width:80px;}
.bpc-name{font-size:9px;color:var(--white);margin-bottom:2px;letter-spacing:1px;}
.bpc-hp,.bpc-mp{font-size:8px;display:flex;justify-content:space-between;gap:4px;color:var(--white);}
.bpc-hp span:first-child{color:#ff9999;}.bpc-mp span:first-child{color:#99bbff;}
.bpc.cur{border-color:var(--gold);}

/* Damage float */
.dmg-float{position:fixed;font-family:'DotGothic16',serif;font-size:20px;font-weight:900;pointer-events:none;z-index:100;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;animation:dfloat 1.1s ease-out forwards;}
@keyframes dfloat{0%{transform:translateY(0) scale(1.2);opacity:1}100%{transform:translateY(-55px) scale(.8);opacity:0}}
.dc-hit{color:#ffe055;}.dc-crit{color:#ff6600;font-size:26px;}.dc-heal{color:#44ff88;}.dc-miss{color:#aaa;font-size:14px;}

/* Spell select */
#spell-screen{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;}
#spell-screen.hidden{display:none;}
#target-screen{position:fixed;inset:0;z-index:61;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;}
#target-screen.hidden{display:none;}
#ally-target-screen{position:fixed;inset:0;z-index:61;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;}
#ally-target-screen.hidden{display:none;}
.tgt-btn{background:var(--win-bg);border:none;color:var(--white);font-family:'DotGothic16',serif;font-size:13px;padding:11px 14px;cursor:pointer;text-align:left;transition:background .06s;width:100%;display:flex;align-items:center;gap:10px;}
.tgt-btn:active{background:rgba(50,90,200,.5);color:var(--gold);}
.tgt-hp-bar{flex:1;height:5px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden;max-width:80px;}
.tgt-hp-fill{height:100%;border-radius:2px;}
.spell-box{width:100%;max-width:480px;}
.spell-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:rgba(60,90,160,.12);max-height:200px;overflow-y:auto;}
.spbtn{background:var(--win-bg);border:none;color:var(--white);font-family:'DotGothic16',serif;font-size:11px;padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background .06s;}
.spbtn:active{background:rgba(50,90,200,.5);color:var(--gold);}
.spbtn:disabled{color:rgba(255,255,255,.22);cursor:not-allowed;}
.sp-mp{font-size:9px;color:#88aaff;}
.sp-cancel{padding:10px;background:rgba(80,20,20,.9);color:var(--text2);cursor:pointer;font-family:'DotGothic16',serif;font-size:11px;text-align:center;border-top:1px solid rgba(255,100,100,.2);transition:background .1s;}

/* Menu */
#menu-screen{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:flex-end;padding:0 12px;}
#menu-screen.hidden{display:none;}
.menu-box{width:min(240px,78vw);}
.mitem{background:var(--win-bg);border:none;color:var(--white);font-family:'DotGothic16',serif;font-size:13px;padding:11px 14px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:9px;transition:background .06s;width:100%;letter-spacing:1px;}
.mitem:active{background:rgba(50,90,200,.5);color:var(--gold);}

/* Status */
#status-screen{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:12px;}
#status-screen.hidden{display:none;}
.status-box{width:100%;max-width:420px;}
.stat-hd{padding:12px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--win-bd);}
.stat-ico{font-size:36px;}.stat-nm{font-size:17px;color:var(--gold);font-family:'Noto Serif JP',serif;font-weight:700;}
.stat-cl{font-size:10px;color:var(--text2);letter-spacing:2px;margin-top:2px;}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px;}
.sg-item{display:flex;flex-direction:column;gap:2px;}
.sg-lbl{font-size:8px;color:var(--white);letter-spacing:2px;}
.sg-val{font-size:17px;color:var(--white);}

/* Equip screen */
#equip-screen{position:fixed;inset:0;z-index:66;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:12px;}
#equip-screen.hidden{display:none;}
.eq-box{width:100%;max-width:440px;display:flex;flex-direction:column;max-height:90vh;}
.eq-slots{display:flex;flex-direction:column;gap:1px;background:rgba(60,90,160,.12);}
.eqslot{background:var(--win-bg);border:none;display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer;color:var(--white);font-family:'DotGothic16',serif;font-size:12px;width:100%;text-align:left;transition:background .06s;}
.eqslot:active,.eqslot.cur{background:rgba(50,90,200,.5);}
.eq-stype{font-size:8px;color:var(--white);letter-spacing:1px;width:44px;flex-shrink:0;}
.eq-sico{font-size:18px;}.eq-snm{flex:1;}.eq-sstat{font-size:9px;color:#88ddff;}
.eq-empty{color:rgba(255,255,255,.3);}
.eq-stats{padding:7px 12px;display:flex;flex-wrap:wrap;gap:6px 14px;border-top:1px solid rgba(60,90,160,.2);border-bottom:1px solid rgba(60,90,160,.2);font-size:10px;}
.eq-chip{color:var(--white);}.eq-chip b{color:var(--gold);}
.eq-list{display:flex;flex-direction:column;gap:1px;background:rgba(60,90,160,.12);overflow-y:auto;flex:1;min-height:60px;}
.eqitem{background:var(--win-bg);border:none;display:flex;align-items:center;gap:9px;padding:8px 12px;cursor:pointer;color:var(--white);font-family:'DotGothic16',serif;font-size:11px;width:100%;text-align:left;transition:background .06s;}
.eqitem:active{background:rgba(50,90,200,.5);}.eqitem.equipped{background:rgba(255,215,0,.1);}
.eq-delta{font-size:9px;}.dplus{color:#00ff88;}.dminus{color:#ff6666;}
.eq-badge{font-size:8px;color:var(--gold);}

/* Item popup */
#item-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:70;padding:18px 28px;text-align:center;animation:ipop 2.4s forwards;}
#item-popup.hidden{display:none;}
@keyframes ipop{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%)}}
.ip-ico{font-size:34px;margin-bottom:6px;}.ip-lbl{font-size:9px;color:var(--text2);letter-spacing:3px;margin-bottom:4px;}.ip-nm{font-size:18px;color:var(--gold);font-family:'Noto Serif JP',serif;font-weight:700;}

/* Level up */
#lvlup-screen{position:fixed;inset:0;z-index:75;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;}
#lvlup-screen.hidden{display:none;}
.lu-box{padding:28px;text-align:center;}
.lu-ico{font-size:44px;margin-bottom:10px;animation:luspin .9s ease-out;}
@keyframes luspin{from{transform:scale(0) rotate(-180deg)}to{transform:scale(1) rotate(0)}}
.lu-lbl{font-size:10px;letter-spacing:4px;color:var(--text2);margin-bottom:3px;}
.lu-nm{font-size:20px;color:var(--gold);font-family:'Noto Serif JP',serif;font-weight:700;margin-bottom:12px;}
.lu-num{font-size:44px;font-weight:900;color:#fff;text-shadow:0 0 18px rgba(255,215,0,.5);}
.lu-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:14px;font-size:11px;color:var(--text2);}
.lu-stats span{color:#00ff88;}
.lu-ok{margin-top:16px;padding:9px 28px;background:linear-gradient(180deg,#4477ff,#1133cc);border:1px solid #6699ff;color:#fff;font-family:'DotGothic16',serif;font-size:13px;border-radius:2px;cursor:pointer;letter-spacing:2px;}

/* Chat input */
#chat-input{position:fixed;bottom:0;left:0;right:0;z-index:80;background:rgba(6,12,36,.97);border-top:1px solid rgba(60,90,160,.4);padding:9px 10px;display:flex;gap:7px;}
#chat-input.hidden{display:none;}
#chat-txt{flex:1;background:rgba(0,0,0,.4);border:1px solid var(--win-bd);color:var(--white);font-family:'DotGothic16',serif;font-size:16px;padding:7px 10px;border-radius:2px;outline:none;}
#chat-txt:focus{border-color:var(--gold);}
.chat-send-btn{background:linear-gradient(180deg,#4477ff,#1133cc);border:1px solid #6699ff;color:#fff;font-family:'DotGothic16',serif;font-size:12px;padding:7px 14px;border-radius:2px;cursor:pointer;}

/* Dialog */
#dialog{position:fixed;bottom:0;left:0;right:0;z-index:30;padding:7px;}
#dialog.hidden{display:none;}
.dialog-inner{padding:12px 14px;min-height:64px;position:relative;background:var(--win-bg);color:var(--white);}
.dialog-nm{font-size:9px;color:var(--gold);letter-spacing:2px;margin-bottom:3px;}
.dialog-tx{font-size:13px;line-height:1.7;letter-spacing:1px;color:var(--white);}
.dialog-next{text-align:right;font-size:10px;color:var(--white);margin-top:6px;}

/* Wave / boss banner */
#wave-banner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:35;text-align:center;display:none;pointer-events:none;}
.wb-txt{font-size:clamp(22px,7vw,44px);font-weight:900;color:var(--gold);font-family:'Noto Serif JP',serif;letter-spacing:4px;text-shadow:0 0 24px rgba(255,215,0,.5);animation:wbp .5s ease-in-out infinite alternate;}
@keyframes wbp{0%{opacity:.75}100%{opacity:1}}
.wb-sub{font-size:11px;color:rgba(255,215,0,.5);letter-spacing:3px;margin-top:4px;}

/* Transition */
#transition{position:fixed;inset:0;z-index:99;background:#000;opacity:0;pointer-events:none;transition:opacity .35s;}
#transition.in{opacity:1;pointer-events:all;}

/* Loading */
#loading{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
#loading.hidden{display:none;}
.ld-title{font-size:14px;color:var(--gold);letter-spacing:4px;}
.ld-bar{width:180px;height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;}
.ld-fill{height:100%;background:linear-gradient(90deg,#4477ff,#44aaff);animation:ldfill 1.4s ease-in-out infinite;}
@keyframes ldfill{0%{width:0}100%{width:100%}}

/* ========== MINIMAP ========== */
#minimap{position:absolute;top:8px;right:8px;width:88px;height:88px;background:rgba(4,8,24,.7);border:1px solid rgba(60,90,160,.4);border-radius:3px;overflow:hidden;}
#minimap canvas{width:100%;height:100%;}

/* ========== SAVE / ONLINE MODAL ========== */
#save-modal,#online-modal,#join-modal{
  position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.75);
  display:flex;align-items:center;justify-content:center;padding:16px;
}
#save-modal.hidden,#online-modal.hidden,#join-modal.hidden{display:none;}
.modal-box{width:min(420px,96vw);max-height:90vh;overflow-y:auto;}
.save-slot{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:rgba(10,20,60,.85);border-bottom:1px solid rgba(60,90,160,.3);
  cursor:pointer;transition:background .08s;color:var(--white);
}
.save-slot:active{background:rgba(30,60,160,.8);}
.save-slot-ico{font-size:22px;width:30px;text-align:center;}
.save-slot-info{flex:1;}
.save-slot-title{font-size:12px;color:var(--white);letter-spacing:1px;}
.save-slot-sub{font-size:9px;color:var(--text2);margin-top:2px;}
.save-slot-act{font-size:10px;color:var(--gold);}
.online-url-box{
  background:rgba(0,0,0,.5);border:1px solid rgba(255,215,0,.3);
  border-radius:3px;padding:10px 12px;font-size:11px;color:var(--gold);
  word-break:break-all;letter-spacing:.5px;margin-bottom:8px;
}
.online-code-big{
  font-size:34px;font-weight:900;color:var(--gold);letter-spacing:10px;
  text-shadow:0 0 14px rgba(255,215,0,.4);text-align:center;padding:10px 0;
}
.party-join-card{
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  background:rgba(10,20,60,.8);border-bottom:1px solid rgba(60,90,160,.2);font-size:12px;color:var(--white);
}
.join-dot{width:7px;height:7px;border-radius:50%;background:#00ff88;box-shadow:0 0 5px #00ff88;flex-shrink:0;}
.join-dot.wait{background:#ffaa00;box-shadow:0 0 5px #ffaa00;}
.scale-badge{
  display:inline-block;padding:2px 8px;border-radius:2px;font-size:9px;
  background:rgba(255,100,50,.2);border:1px solid rgba(255,100,50,.4);
  color:#ff9966;letter-spacing:1px;margin-top:4px;
}
#online-chat-log{

}
.oc-line{font-size:10px;padding:2px 12px;}
.oc-sys{color:#88ccff;font-style:italic;}
.oc-msg{color:var(--white);}
.oc-name{color:var(--gold);}
#save-btn-hud{

}
.hud-save-btn{
  background:rgba(20,40,80,.85);border:1px solid rgba(60,90,160,.5);
  border-radius:3px;color:var(--gold);font-family:'DotGothic16',serif;
  font-size:10px;padding:5px 8px;cursor:pointer;letter-spacing:1px;
  display:flex;align-items:center;gap:4px;
}
.hud-save-btn:active{background:rgba(60,100,200,.7);}
.online-status-bar{
  position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,#00ff88,#00aaff,#8844ff);
  animation:onbar 2s linear infinite;z-index:5;
}
@keyframes onbar{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.players-count-badge{
  position:absolute;top:8px;left:50%;transform:translateX(-50%);

  border-radius:3px;padding:3px 10px;font-size:9px;color:#88ffbb;
  letter-spacing:1px;white-space:nowrap;z-index:11;pointer-events:none;
}
</style>
</head>

// Sprite rendering
const spriteCache = {};
function buildPalette(base){
  const {r,g,b}=hexToRgb(base);
  const cl=(n)=>Math.max(0,Math.min(255,Math.round(n)));
  const shade=(f)=>`rgb(${cl(r*f)},${cl(g*f)},${cl(b*f)})`;
  const tint=(f)=>`rgb(${cl(r+(255-r)*f)},${cl(g+(255-g)*f)},${cl(b+(255-b)*f)})`;
  return {'O':base,'h':tint(.55),'o':shade(.6),'d':shade(.38),'g':shade(.45),'p':tint(.35),
    'c':shade(.5),'M':tint(.45),'S':tint(.92),'w':'#f8f8ff','b':'#141118','r':'#ff3b4e',
    'y':'#ffd633','v':'#fffceb','s':'#c8ccd8','R':shade(.5)};
}
function hexToRgb(hex){
  hex=hex.replace('#','');
  if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');
  return{r:parseInt(hex.substr(0,2),16),g:parseInt(hex.substr(2,2),16),b:parseInt(hex.substr(4,2),16)};
}
function getSpriteURL(spriteKey,baseColor,displaySize){
  const k=spriteKey+'_'+baseColor+'_'+displaySize;
  if(spriteCache[k])return spriteCache[k];
  const pat=SPRITE_PATTERNS[spriteKey]||SPRITE_PATTERNS.slime;
  const rows=pat.length,cols=pat[0].length;
  const px=Math.max(4,Math.ceil(displaySize/cols));
  const cv=document.createElement('canvas');
  cv.width=cols*px;cv.height=rows*px;
  const c=cv.getContext('2d');c.imageSmoothingEnabled=false;
  const pal=buildPalette(baseColor);
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const ch=pat[y][x];if(ch==='.')continue;
    c.fillStyle=pal[ch]||baseColor;c.fillRect(x*px,y*px,px,px);
  }
  return spriteCache[k]=cv.toDataURL();
}

  },1200);
});
function createStars(){
  const c=document.getElementById('tstars');
  for(let i=0;i<100;i++){
    const s=document.createElement('div');s.className='tstar';
    const sz=Math.random()*2.5+.5;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${(Math.random()*3+1).toFixed(1)}s;animation-delay:${(Math.random()*3).toFixed(1)}s`;
    c.appendChild(s);
  }
}

function showLobby(mode){
  G.mode=mode;
  document.getElementById('title-screen').classList.add('hidden');
  document.getElementById('lobby-screen').classList.remove('hidden');
  const t=document.getElementById('lobby-title');
  const b=document.getElementById('lobby-body');
  if(mode==='solo'){t.textContent='⚔️ ひとり旅';b.innerHTML=buildLobbyHTML(false,false);}
  else if(mode==='create'){t.textContent='🌐 部屋を作る';b.innerHTML=buildLobbyHTML(true,true);}
  else{t.textContent='🤝 仲間に合流';b.innerHTML=buildLobbyHTML(true,false);}

  // PeerJS 初期化（create=ホスト / join=ゲスト）
  if(mode==='create') initPeer('host');
  else if(mode==='join') initPeer('guest');
}

    <div class="cls-btn ${k==='warrior'?'sel':''}" onclick="selCls(this,'${k}')" data-cls="${k}">
      <span class="cls-icon">${v.icon}</span><div class="cls-name">${v.name}</div>
    </div>`).join('');

  // Party slots (1 = self, 2-4 = NPC companions) — 職業グリッド常時表示
  const partySlots = [1,2,3,4].map(i=>`
    <div class="party-slot" id="pslot-${i}">
      <div class="party-slot-head">
        <span class="slot-num">${i===1?'自分':i+'人目'}</span>
        <input class="slot-name-in" id="pname-${i}"
          placeholder="${i===1?'名前（8文字）':i+'人目（空白=参加なし）'}"
          maxlength="8">
      </div>
      <div id="pslot-cls-${i}">
        <div class="class-row" id="clsgrid-${i}">
          ${Object.entries(CLASSES).map(([k,v])=>`
            <div class="cls-btn ${k==='warrior'?'sel':''}" onclick="selClsSlot(this,${i},'${k}')" data-cls="${k}">
              <span class="cls-icon">${v.icon}</span><div class="cls-name">${v.name}</div>
            </div>`).join('')}
        </div>
      </div>
    </div>`).join('');

  let roomSection='';
  if(online&&isHost){
    roomSection=`
    <div class="room-box">
      <div style="font-size:10px;color:#aaffcc;letter-spacing:2px;margin-bottom:4px;">あなたのID（友達に伝える）</div>
      <div class="room-code-disp" id="peer-id-disp" style="letter-spacing:4px;">生成中…</div>
      <button class="btn-sec" style="margin-top:6px;font-size:11px;padding:4px 12px;"
        onclick="navigator.clipboard.writeText(document.getElementById('peer-id-disp').textContent).then(()=>alert('IDをコピーしました！'))">
        📋 コピー
      </button>
      <div id="peer-connect-status" style="font-size:10px;color:#ffee88;margin-top:8px;">⏳ PeerJS接続待機中…</div>
      <div id="peer-start-btn-wrap" style="margin-top:4px;">
        <button id="peer-start-btn" class="btn-prim" disabled onclick="startGame()" style="opacity:0.5;">
          🌐 接続後に出発
        </button>
      </div>
    </div>`;
  } else if(online&&!isHost){
    roomSection=`
    <div class="room-box">
      <div style="font-size:10px;color:#aaffcc;letter-spacing:2px;margin-bottom:4px;">ホストのIDを入力</div>
      <input class="linput" id="join-code" placeholder="ホストのID（例: AB3X7K）"
        maxlength="8" oninput="this.value=this.value.toUpperCase()" style="text-align:center;letter-spacing:3px;">
      <button class="btn-sec" style="margin-top:6px;font-size:11px;padding:4px 12px;" onclick="connectToHost()">
        🔗 接続する
      </button>
      <div id="peer-connect-status" style="font-size:10px;color:#ffee88;margin-top:8px;"></div>
      <div id="peer-id-disp" style="display:none;"></div>
    </div>`;
  }

  const btnLbl = online&&isHost ? '🌐 接続後に出発（上のボタンを使用）' : (online ? '🤝 接続後に出発' : '⚔️ 冒険開始！');
  const mainBtn = online&&isHost ? '' : `<button class="btn-prim" id="peer-start-btn" ${online?'disabled style="opacity:0.5;"':''} onclick="startGame()">${btnLbl}</button>`;
  return `
    <div class="lfield"><label>パーティを作る（最大4人）</label><div class="party-builder">${partySlots}</div></div>
    ${roomSection}
    ${mainBtn}
    <button class="btn-sec" onclick="backTitle()">← もどる</button>`;
}

// Track per-slot class selection
const slotClass = {1:'warrior',2:'warrior',3:'warrior',4:'warrior'};
function selCls(el,cls){el.closest('.class-row')?.querySelectorAll('.cls-btn').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');}
function selClsSlot(el,slot,cls){slotClass[slot]=cls;selCls(el,cls);}
function backTitle(){document.getElementById('lobby-screen').classList.add('hidden');document.getElementById('title-screen').classList.remove('hidden');}

function makeChar(slot){
  const nameEl=document.getElementById('pname-'+slot);
  const name=(nameEl?.value.trim())||'';
  if(slot>1&&!name)return null; // optional companion
  const clsKey=slotClass[slot]||'warrior';
  const cls=CLASSES[clsKey];
  const id=genId();
  return {
    id,slot,name:name||(cls.name+'の戦士'),
    class:clsKey,icon:cls.icon,color:cls.color,lv:1,exp:0,expNext:30,
    hp:cls.stats.hp,maxHp:cls.stats.hp,mp:cls.stats.mp,maxMp:cls.stats.mp,
    baseAtk:cls.stats.atk,baseDef:cls.stats.def,baseSpd:cls.stats.spd,baseInt:cls.stats.int,baseMaxMp:cls.stats.mp,
    atk:cls.stats.atk,def:cls.stats.def,spd:cls.stats.spd,int:cls.stats.int,
    equip:{weapon:null,armor:null,accessory:null},inventory:['w1','a1'],
    items:[{...ITEMS_DROP[0]},{...ITEMS_DROP[0]}],
    gold:50,buffed:false,isNPC:slot>1,
    x:7*G.TILE,y:7*G.TILE, // pixel position on map
  };
}

async function startGame(){
  G.playerId=genId();
  G.party=[];
  for(let i=1;i<=4;i++){const c=makeChar(i);if(c)G.party.push(c);}
  if(!G.party.length)return;
  G.party.forEach(c=>recalcStats(c));

  // セーブデータがあれば自分のパーティ情報で上書き（継続プレイのため）
  // ※ 「冒険を続ける」ボタンからではなく普通に新規で始める場合は上書きしない
  document.getElementById('lobby-screen').classList.add('hidden');

  // ゲストとして参加する場合: PeerJS 接続は showLobby('join') → initPeer('guest') → connectToHost() で確立済み
  // ここでは mode フラグのみ保持する

  fadeIn(()=>{
    document.getElementById('game-screen')?.classList?.remove('hidden');
    initGame();
  });
}

// ============================================================
// SAVE / LOAD SYSTEM
// ============================================================
const SAVE_SLOTS = 3;
const SAVE_KEY_PREFIX = 'al1_save_';

function getSaveData(slot) {
  try { return JSON.parse(localStorage.getItem(SAVE_KEY_PREFIX + slot)); } catch(e){ return null; }
}
function setSaveData(slot, data) {
  localStorage.setItem(SAVE_KEY_PREFIX + slot, JSON.stringify(data));
}
function deleteSaveData(slot) {
  localStorage.removeItem(SAVE_KEY_PREFIX + slot);
}

function buildSaveSnapshot() {
  return {
    version: 2,
    savedAt: Date.now(),
    mapIdx: G.mapIdx,
    dungeonFloor: G.dungeonFloor,
    clearedDungeons: G.clearedDungeons,
    party: G.party.map(p => ({...p})),
  };
}

function restoreFromSnapshot(snap) {
  G.mapIdx = snap.mapIdx || 0;
  G.dungeonFloor = snap.dungeonFloor || 0;
  G.clearedDungeons = snap.clearedDungeons || {};
  G.party = snap.party.map(p => ({...p}));
  G.party.forEach(c => recalcStats(c));
}

function openSaveModal() {
  renderSaveSlots();
  document.getElementById('save-modal').classList.remove('hidden');
}
function closeSaveModal() {
  document.getElementById('save-modal').classList.add('hidden');
}

function renderSaveSlots() {
  const el = document.getElementById('save-slots-list');
  let html = '';
  for (let s = 1; s <= SAVE_SLOTS; s++) {
    const data = getSaveData(s);
    if (data) {
      const leader = data.party[0];
      const d = new Date(data.savedAt);
      const dtStr = `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
      const mapName = MAPS_DEF[data.mapIdx]?.name || '不明';
      html += `<div class="save-slot">
        <div class="save-slot-ico">${leader?.icon||'⚔️'}</div>
        <div class="save-slot-info">
          <div class="save-slot-title">${leader?.name||'???'} Lv.${leader?.lv||1} ／ ${mapName}</div>
          <div class="save-slot-sub">パーティ${data.party.length}人 ・ ${dtStr}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;">
          <button onclick="loadGame(${s})" class="hud-save-btn" style="font-size:9px;padding:4px 8px;">📂 ロード</button>
          <button onclick="saveGame(${s})" class="hud-save-btn" style="font-size:9px;padding:4px 8px;color:#88ccff;">💾 上書き</button>
          <button onclick="confirmDeleteSave(${s})" class="hud-save-btn" style="font-size:9px;padding:4px 8px;color:#ff8888;">🗑 削除</button>
        </div>
      </div>`;
    } else {
      html += `<div class="save-slot">
        <div class="save-slot-ico">📭</div>
        <div class="save-slot-info">
          <div class="save-slot-title" style="color:var(--white);">スロット ${s}（空き）</div>
        </div>
        <button onclick="saveGame(${s})" class="hud-save-btn" style="font-size:9px;padding:4px 8px;">💾 セーブ</button>
      </div>`;
    }
  }
  el.innerHTML = html;
}

function saveGame(slot) {
  const snap = buildSaveSnapshot();
  setSaveData(slot, snap);
  addChat('💾 スロット'+slot+'にセーブしました！', null, true);
  closeSaveModal();
  // オートセーブ通知
  showAutoSaveFlash();
}

function loadGame(slot) {
  const data = getSaveData(slot);
  if (!data) { addChat('セーブデータがありません', null, true); return; }
  closeSaveModal();
  // タイトル画面が表示されている場合も隠す
  document.getElementById('title-screen').classList.add('hidden');
  if (!G.playerId) G.playerId = genId();
  if (!G.mode) G.mode = 'solo';
  fadeIn(() => {
    restoreFromSnapshot(data);
    initGame();
    addChat('📂 スロット' + slot + 'からロードしました！', null, true);
  });
}

function confirmDeleteSave(slot) {
  if (confirm('スロット'+slot+'のデータを削除しますか？')) {
    deleteSaveData(slot);
    renderSaveSlots();
  }
}

function showAutoSaveFlash() {
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;bottom:140px;right:10px;z-index:200;background:rgba(0,100,50,.85);border:1px solid rgba(0,200,100,.4);border-radius:3px;padding:5px 10px;font-family:DotGothic16,serif;font-size:10px;color:#88ffbb;letter-spacing:1px;animation:cfade 3s forwards;';
  el.textContent = '💾 セーブ完了';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// タイトル画面でセーブデータ確認
function checkExistingSave() {
  for (let s = 1; s <= SAVE_SLOTS; s++) {
    if (getSaveData(s)) {
      document.getElementById('btn-continue').style.display = '';
      return;
    }
  }
}

function showContinue() {
  // セーブスロットを調べて、1つなら直接ロード、複数なら選択モーダル
  const slots = [];
  for (let s = 1; s <= SAVE_SLOTS; s++) {
    const d = getSaveData(s);
    if (d) slots.push({ slot: s, data: d });
  }
  if (slots.length === 1) {
    // 1スロットのみ → 直接ロード
    directLoadGame(slots[0].slot, slots[0].data);
  } else {
    // 複数 → モーダルで選択（タイトル上に表示）
    renderSaveSlots();
    document.getElementById('save-modal').classList.remove('hidden');
  }
}

function directLoadGame(slot, data) {
  // タイトル画面を隠してゲームを起動
  document.getElementById('title-screen').classList.add('hidden');
  G.playerId = genId();
  G.mode = 'solo';
  fadeIn(() => {
    restoreFromSnapshot(data);
    initGame();
    addChat('📂 スロット' + slot + 'からロードしました！', null, true);
  });
}

// ============================================================
// ONLINE SYSTEM  ── PeerJS P2P リアルタイム通信
// ============================================================
//
// 通信プロトコル (P2Pメッセージ type 一覧)
//   party_update  : パーティ情報を相手に送る
//   battle_start  : ホスト→ゲスト  バトル開始通知 + 敵データ
//   battle_cmds   : ゲスト→ホスト  コマンド送信
//   battle_result : ホスト→ゲスト  ターン結果（敵HP + ログ）
//   battle_end    : ホスト→ゲスト  バトル終了通知
//   chat          : 双方向チャット
//
// ロール
//   ホスト … 部屋を作ったプレイヤー。ダメージ計算を担当。
//   ゲスト … IDを入力して接続したプレイヤー。コマンドを送るだけ。
// ============================================================

const ONLINE = {
  isOnline:      false,
  isHost:        false,
  myPeerId:      '',   // 自分の PeerJS ID
  remotePeerId:  '',   // 相手の PeerJS ID
  remoteParties: [],   // [{playerId, name, party}]
  chatLog:       [],
  guestCmds:     null, // ゲストから受け取ったコマンド（ホスト側）
};

// PeerJS インスタンスと DataConnection
let _peer = null;
let _conn = null;

// ─── エンコード / デコード ────────────────────────────────
// パーティデータをURLセーフなBase64に変換
function encodePartyToHash(party) {
  const minimal = party.map(p => ({
    id: p.id, name: p.name, class: p.class, icon: p.icon, color: p.color,
    lv: p.lv, exp: p.exp, expNext: p.expNext,
    hp: p.hp, maxHp: p.maxHp, mp: p.mp, maxMp: p.maxMp,
    baseAtk: p.baseAtk, baseDef: p.baseDef, baseSpd: p.baseSpd, baseInt: p.baseInt,
    baseMaxMp: p.baseMaxMp, atk: p.atk, def: p.def, spd: p.spd, int: p.int,
    equip: p.equip, inventory: p.inventory, gold: p.gold,
  }));
  return btoa(encodeURIComponent(JSON.stringify(minimal)));
}
function decodePartyFromHash(hash) {
  try { return JSON.parse(decodeURIComponent(atob(hash))); } catch(e){ return null; }
}

// ─────────────────────────────────────────────────────────────
//  PeerJS 初期化
//  ロビーを開いたとき（mode='create' or 'join'）に呼ぶ
// ─────────────────────────────────────────────────────────────
function initPeer(role) {
  if (_peer && !_peer.destroyed) return; // 既に初期化済み

  // 6文字の短いIDを自前で生成（PeerJSデフォルトUUIDより扱いやすい）
  const myId = genCode();
  _peer = new Peer(myId, { debug: 0 });

  _peer.on('open', (id) => {
    ONLINE.myPeerId = id;
    // ロビー画面上のID表示を更新
    const disp = document.getElementById('peer-id-disp');
    if (disp) disp.textContent = id;
    const statusEl = document.getElementById('peer-connect-status');
    if (statusEl) statusEl.textContent = '⏳ 相手の接続を待っています…';
  });

  if (role === 'host') {
    // ホスト: 相手から接続が来たら受け入れる
    _peer.on('connection', (c) => {
      _setupConn(c, true);
    });
  }

  _peer.on('error', (err) => {
    const statusEl = document.getElementById('peer-connect-status');
    if (statusEl) statusEl.textContent = '⚠️ エラー: ' + err.message;
    console.error('PeerJS:', err);
  });
}

// ─── 接続確立 / DataChannel セットアップ ────────────────
function _setupConn(c, asHost) {
  _conn = c;
  ONLINE.isHost = !!asHost;
  ONLINE.remotePeerId = c.peer;

  c.on('open', () => {
    ONLINE.isOnline = true;

    // ロビーのステータス表示を更新
    const statusEl = document.getElementById('peer-connect-status');
    if (statusEl) statusEl.textContent = '✅ 接続成功！出発ボタンを押してください';
    const startBtn = document.getElementById('peer-start-btn');
    if (startBtn) { startBtn.removeAttribute('disabled'); startBtn.style.opacity = '1'; }
  });

  c.on('data', (msg) => _handleP2P(msg));

  c.on('close', () => {
    ONLINE.isOnline = false;
    ONLINE.remoteParties = [];
    addChat('⚠️ 接続が切れました', null, true);
    updatePlayersBadge();
  });

  c.on('error', (err) => {
    console.error('DataConnection error:', err);
  });
}

// ─── P2P メッセージ送信 ──────────────────────────────────
function _sendP2P(msg) {
  if (_conn && _conn.open) {
    _conn.send(msg);
  }
}

// ─── P2P メッセージ受信ハンドラ ─────────────────────────
function _handleP2P(msg) {
  switch (msg.type) {

    case 'party_update': {
      const p = decodePartyFromHash(msg.party);
      if (p) {
        ONLINE.remoteParties = [{
          playerId: ONLINE.remotePeerId,
          name: p[0]?.name || '相手',
          party: p,
        }];
        updatePlayersBadge();
        applyOnlineScaling();
        updateOnlineModal();
      }
      break;
    }

    case 'battle_start': {
      // ゲストがホストからバトル開始通知を受け取った
      if (!ONLINE.isHost && !G.inBattle) {
        const enemies = msg.enemies.map((e, i) => ({ ...e, idx: i }));
        startBattle(enemies);
      }
      break;
    }

    case 'battle_cmds': {
      // ホストがゲストのコマンドを受け取った
      if (ONLINE.isHost) {
        ONLINE.guestCmds = msg.cmds;
        G.guestCmdsReceived = true;
        _onGuestCmdsReceived();
      }
      break;
    }

    case 'battle_result': {
      // ゲストがホストのターン結果を受け取った
      if (!ONLINE.isHost && G.inBattle) {
        msg.enemies.forEach((e, i) => {
          if (G.battleEnemies[i]) G.battleEnemies[i].curHp = e.curHp;
        });
        renderBattle();
        if (msg.log?.length) setBMsg(msg.log[msg.log.length - 1]);
        // コマンド選択に戻る（ゲスト側）
        setTimeout(() => {
          if (G.battleEnemies.every(e => e.curHp <= 0)) { battleVictory(); return; }
          if (G.party.every(p => p.hp <= 0)) { gameover(); return; }
          clearTurnFlags();
          renderBattle();
          startCommandSelect();
        }, 600);
      }
      break;
    }

    case 'battle_end': {
      if (!ONLINE.isHost && G.inBattle) {
        endBattle();
      }
      break;
    }

    case 'chat': {
      addChat(msg.msg, msg.name, false);
      appendOnlineChatLine({ name: msg.name, msg: msg.msg, sys: false });
      break;
    }
  }
}

// ─── ゲスト: ロビーから接続ボタンを押したとき ───────────
function connectToHost() {
  const hostId = document.getElementById('join-code')?.value?.trim()?.toUpperCase();
  if (!hostId || hostId.length < 4) {
    document.getElementById('peer-connect-status').textContent = '⚠️ ホストのIDを入力してください';
    return;
  }
  if (!_peer || _peer.destroyed) {
    document.getElementById('peer-connect-status').textContent = '⚠️ まずパーティを作成してください';
    return;
  }
  document.getElementById('peer-connect-status').textContent = '🔄 接続中…';
  const c = _peer.connect(hostId, { reliable: true });
  _setupConn(c, false); // guest
}

// ─── バッジ / スケーリング ───────────────────────────────
function showOnlineBadge() {
  document.getElementById('online-status-bar').style.display = '';
  const badge = document.getElementById('online-players-badge');
  badge.style.display = '';
  updatePlayersBadge();
}
function updatePlayersBadge() {
  const total = 1 + ONLINE.remoteParties.length;
  document.getElementById('online-players-badge').textContent = `🌐 ${total}人で冒険中`;
}
function applyOnlineScaling() {
  const total = 1 + ONLINE.remoteParties.length;
  if (total <= 1) return;
  G.onlinePlayerCount = total;
  document.getElementById('online-players-badge').textContent =
    `🌐 ${total}人で冒険中 ／ 敵強化×${total.toFixed(1)}`;
}
function getScaledEnemyGroup(baseEnemies) {
  const count = G.onlinePlayerCount || 1;
  if (count <= 1) return baseEnemies;
  const scaled = baseEnemies.map(e => ({
    ...e,
    maxHp: Math.floor(e.hp * (1 + (count-1)*0.6)),
    curHp: Math.floor(e.hp * (1 + (count-1)*0.6)),
    atk:   Math.floor(e.atk * (1 + (count-1)*0.3)),
    def:   Math.floor(e.def * (1 + (count-1)*0.2)),
    exp:   Math.floor(e.exp * count),
    gold:  Math.floor(e.gold * count),
  }));
  if (count >= 3 && scaled.length < 3) {
    const extra = { ...baseEnemies[0],
      maxHp: Math.floor(baseEnemies[0].hp * 0.7 * count),
      atk:   Math.floor(baseEnemies[0].atk * count * 0.5),
      idx:   scaled.length,
    };
    extra.curHp = extra.maxHp;
    scaled.push(extra);
  }
  return scaled;
}

// ─── オンラインモーダル ──────────────────────────────────
function openOnlineModal() {
  const id = ONLINE.myPeerId;
  if (id) document.getElementById('om-code').textContent = id;
  const url = `${location.href.split('#')[0]}#p2p:${id}`;
  document.getElementById('om-url').textContent = url;
  updateOnlineModal();
  document.getElementById('online-modal').classList.remove('hidden');
}
function closeOnlineModal() { document.getElementById('online-modal').classList.add('hidden'); }
function updateOnlineModal() {
  const listEl = document.getElementById('om-party-list');
  if (!listEl) return;
  const all = [
    { name: (G.party[0]?.name || '自分') + '（あなた）', party: G.party, isMe: true },
    ...ONLINE.remoteParties.map(r => ({ name: r.name, party: r.party, isMe: false })),
  ];
  listEl.innerHTML = all.map(p => `
    <div class="party-join-card">
      <div class="join-dot ${p.isMe?'':'wait'}"></div>
      <span>${p.name}</span>
      <span style="margin-left:auto;font-size:9px;color:var(--white);">${p.party.length}人パーティ</span>
    </div>`).join('');
  const scaleEl = document.getElementById('om-scale-info');
  if (all.length > 1) {
    scaleEl.style.display = '';
    scaleEl.textContent = `⚡ ${all.length}人参加中 ／ 敵HP×${(1+(all.length-1)*0.6).toFixed(1)} ／ 報酬×${all.length}`;
  } else { scaleEl.style.display = 'none'; }
}
function copyJoinUrl() {
  const id = ONLINE.myPeerId;
  navigator.clipboard.writeText(id)
    .then(() => { addChat('📋 あなたのIDをコピーしました！', null, true); closeOnlineModal(); })
    .catch(() => prompt('このIDを友達に教えてください:', id));
}

function sendOnlineChat() {

  input.value = '';
  const name = G.party[0]?.name || '?';

function appendOnlineChatLine(m) {

}

// ホスト: バトル開始をゲストに通知
function _syncBattleStart(enemies) {
  if (!ONLINE.isOnline || !ONLINE.isHost) return;
  G.guestCmdsReceived = false;
  _sendP2P({
    type: 'battle_start',
    enemies: enemies.map(e => ({
      name: e.name, curHp: e.curHp, maxHp: e.maxHp,
      atk: e.atk, def: e.def, exp: e.exp, gold: e.gold,
      sprite: e.sprite, color: e.color,
    })),
  });
}

// ホスト: ターン結果をゲストに送信
function _syncBattleAfterTurn(logLines) {
  if (!ONLINE.isOnline || !ONLINE.isHost) return;
  _sendP2P({
    type: 'battle_result',
    enemies: G.battleEnemies.map(e => ({
      name: e.name, curHp: e.curHp, maxHp: e.maxHp,
      atk: e.atk, def: e.def, exp: e.exp, gold: e.gold,
    })),
    log: logLines,
  });
  G.guestCmdsReceived = false;
}

// ホスト: バトル終了をゲストに通知
function _syncBattleEnd() {
  if (!ONLINE.isOnline || !ONLINE.isHost) return;
  _sendP2P({ type: 'battle_end' });
}

// ゲスト: コマンドをホストに送信
function _submitGuestCmds(cmdQueue) {
  if (!ONLINE.isOnline || ONLINE.isHost) return Promise.resolve();
  _sendP2P({
    type: 'battle_cmds',
    cmds: cmdQueue.map(q => ({
      actorId: q.actor.id, type: q.type,
      targetIdx: q.targetIdx ?? -1, spellIdx: q.spellIdx ?? -1,
    })),
  });
  return Promise.resolve();
}

// ホスト: ゲストのコマンドが届いたら実行フェーズへ
function _onGuestCmdsReceived() {
  if (!G.waitingForGuest) return;
  G.waitingForGuest = false;
  setBMsg('✅ パートナーのコマンドを受信！実行中…');

  const guestParty = ONLINE.remoteParties[0]?.party || [];
  const guestCmds = (ONLINE.guestCmds || []).map(q => {
    const actor = guestParty.find(p => p.id === q.actorId) ?? guestParty[0];
    return actor ? { actor, type: q.type, targetIdx: q.targetIdx, spellIdx: q.spellIdx } : null;
  }).filter(Boolean);

  G.cmdQueue = [...(G.hostCmdsBackup || []), ...guestCmds];
  _reallyExecuteTurn();
}

function parseJoinUrl() {
  const hash = location.hash.slice(1);
  if (!hash) return null;
  const [code, partyHash] = hash.split('|');
  if (!code) return null;
  return { code, partyData: partyHash ? decodePartyFromHash(partyHash) : null };
}
function buildJoinUrl(code, party) {
  return `${location.href.split('#')[0]}#${code}|${encodePartyToHash(party)}`;
}

const MAP_W=24, MAP_H=18;

function initGame(){
  generateMap(G.mapIdx||0);
  startLoop();
  updatePartyHUD();

function generateMap(idx){
  G.mapIdx=idx;
  const map=MAPS_DEF[idx];
  G.tiles=[];
  G.npcsOnMap=[];
  G.chests=[];
  G.mapEnemies=[];

  for(let y=0;y<MAP_H;y++){G.tiles[y]=[];for(let x=0;x<MAP_W;x++)G.tiles[y][x]=(x===0||y===0||x===MAP_W-1||y===MAP_H-1)?T.WALL:T.FLOOR;}

  const rng=n=>Math.floor(Math.random()*n);
  if(map.type==='dungeon'){
    // Dungeon: random walls
    for(let i=0;i<15;i++){const w=rng(3)+1,h=rng(3)+1,wx=rng(MAP_W-w-2)+1,wy=rng(MAP_H-h-2)+1;
      for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){if(Math.abs(wx+xx-12)<3&&Math.abs(wy+yy-14)<3)continue;G.tiles[wy+yy][wx+xx]=T.WALL;}}
    G.tiles[14][12]=T.FLOOR; // spawn clear
    G.tiles[15][12]=T.STAIR_U;
    const isLast=(G.dungeonFloor===map.floors-1);
    if(isLast){G.tiles[2][12]=T.BOSS_GATE;}
    else{let sx,sy,t=0;do{sx=rng(MAP_W-4)+2;sy=rng(5)+1;t++;}while(G.tiles[sy][sx]!==T.FLOOR&&t<60);G.tiles[sy][sx]=T.STAIR_D;}
    // Chests
    for(let i=0;i<2;i++){let cx,cy,t2=0;do{cx=rng(MAP_W-2)+1;cy=rng(MAP_H-2)+1;t2++;}while(G.tiles[cy][cx]!==T.FLOOR&&t2<40);if(G.tiles[cy][cx]===T.FLOOR){G.tiles[cy][cx]=T.CHEST;G.chests.push({x:cx,y:cy,opened:false});}}
    setPlayerPos(12,14);
  } else {
    // Field/Town
    if(map.type==='field'){
      for(let i=0;i<10;i++){const wx=rng(MAP_W-2)+1,wy=rng(MAP_H-2)+1;if(Math.abs(wx-12)<2&&Math.abs(wy-9)<2)continue;G.tiles[wy][wx]=T.WALL;}
      for(let i=0;i<8;i++){const tx=rng(MAP_W-2)+1,ty=rng(MAP_H-2)+1;if(G.tiles[ty][tx]===T.FLOOR)G.tiles[ty][tx]=T.TREE;}
      if(idx<MAPS_DEF.length-1)G.tiles[1][MAP_W-2]=T.EXIT;
    }
    if(map.type==='town'){
      // Town: structured
      for(let i=0;i<6;i++){const wx=rng(MAP_W-4)+2,wy=rng(MAP_H-4)+2;
        if(Math.abs(wx-12)<3&&Math.abs(wy-9)<3)continue;
        const w=rng(3)+2,h=rng(2)+2;
        for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++)if(wx+xx<MAP_W-1&&wy+yy<MAP_H-1)G.tiles[wy+yy][wx+xx]=T.WALL;}
      for(let i=0;i<5;i++){const tx=rng(MAP_W-2)+1,ty=rng(MAP_H-2)+1;if(G.tiles[ty][tx]===T.FLOOR)G.tiles[ty][tx]=T.TREE;}
      // NPCs
      NPCS.forEach(n=>{if(G.tiles[n.y][n.x]===T.FLOOR){G.tiles[n.y][n.x]=T.NPC;G.npcsOnMap.push({...n});}});
      if(idx<MAPS_DEF.length-1)G.tiles[1][MAP_W-2]=T.EXIT;
    }
    setPlayerPos(12,9);
  }

  // Spawn roaming enemies
  if(map.encounter>0){
    const count=3+G.mapIdx*2;
    for(let i=0;i<count;i++) spawnMapEnemy();
  }

  document.getElementById('map-label').textContent=
    map.type==='dungeon'?`🏰 ${map.name} B${G.dungeonFloor+1}F`:`🗺️ ${map.name}`;
}

function setPlayerPos(tx,ty){
  const px=tx*G.TILE+G.TILE/2, py=ty*G.TILE+G.TILE/2;
  G.party.forEach((c,i)=>{c.x=px+(i%2)*12;c.y=py+Math.floor(i/2)*12;});
}

// Spawn a roaming enemy on the map
function spawnMapEnemy(){
  const map=MAPS_DEF[G.mapIdx];
  const eIdx=map.enemies[Math.floor(Math.random()*map.enemies.length)];
  const tmpl=ENEMIES_DATA[eIdx];
  let tx,ty,tries=0;
  do{tx=Math.floor(Math.random()*(MAP_W-2))+1;ty=Math.floor(Math.random()*(MAP_H-2))+1;tries++;}
  while((G.tiles[ty]?.[tx]!==T.FLOOR||Math.hypot(tx-12,ty-9)<5)&&tries<60);
  if(G.tiles[ty]?.[tx]!==T.FLOOR)return;

  const angle=Math.random()*Math.PI*2;
  G.mapEnemies.push({
    ...tmpl,idx:eIdx,
    x:tx*G.TILE+G.TILE/2, y:ty*G.TILE+G.TILE/2,
    vx:Math.cos(angle)*tmpl.spd*0.6,
    vy:Math.sin(angle)*tmpl.spd*0.6,
    dirTimer:0,
    curHp:tmpl.hp,
    dead:false,
    scale:1,
  });
}

// ============================================================
// GAME LOOP
// ============================================================
let lastTime=0, animId=null;

function startLoop(){
  if(animId)cancelAnimationFrame(animId);
  lastTime=performance.now();
  animId=requestAnimationFrame(loop);
}

function loop(now){
  animId=requestAnimationFrame(loop);
  if(G.inBattle)return;
  const dt=Math.min((now-lastTime)/1000,.05);
  lastTime=now;
  updatePlayer(dt);
  updateMapEnemies(dt);
  checkEnemyContact();
  updateCamera();
  render();
  drawMinimap();
}

// ============================================================
// PLAYER MOVEMENT (smooth joystick)
// ============================================================
const MOVE_SPEED=120; // px/sec

function updatePlayer(dt){
  const leader=G.party[0];
  if(!leader)return;

  // Joystick input
  let dx=G.joy.dx, dy=G.joy.dy;
  // Keyboard fallback
  if(G.keys.ArrowLeft||G.keys.a)dx=-1;
  if(G.keys.ArrowRight||G.keys.d)dx=1;
  if(G.keys.ArrowUp||G.keys.w)dy=-1;
  if(G.keys.ArrowDown||G.keys.s)dy=1;

  // Normalize diagonal
  const len=Math.hypot(dx,dy);
  if(len>1){dx/=len;dy/=len;}

  const spd=MOVE_SPEED*dt;
  const nx=leader.x+dx*spd, ny=leader.y+dy*spd;

  // Collision check
  if(canWalk(nx,leader.y))leader.x=nx;
  if(canWalk(leader.x,ny))leader.y=ny;

  // Tile interaction
  const tx=Math.floor(leader.x/G.TILE), ty=Math.floor(leader.y/G.TILE);
  handleTileAt(tx,ty);

  // Followers trail leader
  for(let i=1;i<G.party.length;i++){
    const prev=G.party[i-1], me=G.party[i];
    const fdx=prev.x-me.x, fdy=prev.y-me.y;
    const fd=Math.hypot(fdx,fdy);
    if(fd>G.TILE*0.8){
      const fs=Math.min(spd*1.1,fd);
      const nx2=me.x+(fdx/fd)*fs, ny2=me.y+(fdy/fd)*fs;
      if(canWalk(nx2,me.y))me.x=nx2;
      if(canWalk(me.x,ny2))me.y=ny2;
    }
  }
}

function canWalk(px,py){
  const TL=4; // lookahead
  const checks=[[px-TL,py-TL],[px+TL,py-TL],[px-TL,py+TL],[px+TL,py+TL]];
  for(const [cx,cy] of checks){
    const tx=Math.floor(cx/G.TILE),ty=Math.floor(cy/G.TILE);
    if(ty<0||ty>=MAP_H||tx<0||tx>=MAP_W)return false;
    const t=G.tiles[ty][tx];
    if(t===T.WALL||t===T.TREE)return false;
    // Boss gate blocks unless cleared
    if(t===T.BOSS_GATE&&!G.clearedDungeons[G.mapIdx])return false;
  }
  return true;
}

function handleTileAt(tx,ty){
  if(G.transitioning)return;
  if(ty<0||ty>=MAP_H||tx<0||tx>=MAP_W)return;
  const t=G.tiles[ty][tx];
  if(t===T.EXIT){changeMap(G.mapIdx+1);}
  else if(t===T.STAIR_D){descendFloor();}
  else if(t===T.STAIR_U){ascendFloor();}
  else if(t===T.BOSS_GATE&&G.clearedDungeons[G.mapIdx]){/* pass through */}
  else if(t===T.CHEST){openChestAt(tx,ty);}
}

// ============================================================
// MAP ENEMY AI
// ============================================================
function updateMapEnemies(dt){
  const TILE=G.TILE;
  G.mapEnemies.forEach(e=>{
    if(e.dead)return;
    e.dirTimer-=dt;
    if(e.dirTimer<=0){
      // Wander randomly
      const angle=Math.random()*Math.PI*2;
      const spd=e.spd*(35+Math.random()*25);
      e.vx=Math.cos(angle)*spd/100*TILE;
      e.vy=Math.sin(angle)*spd/100*TILE;
      e.dirTimer=1+Math.random()*2;
    }

    const nx=e.x+e.vx*dt, ny=e.y+e.vy*dt;
    const tx=Math.floor(nx/TILE),ty=Math.floor(ny/TILE);

    // Bounce off walls
    if(ty>=0&&ty<MAP_H&&tx>=0&&tx<MAP_W&&G.tiles[ty]?.[tx]!==T.WALL&&G.tiles[ty]?.[tx]!==T.TREE){
      e.x=nx;e.y=ny;
    } else {
      e.vx*=-1;e.vy*=-1;
    }

    // Stay in bounds
    e.x=Math.max(G.TILE,Math.min((MAP_W-1)*G.TILE,e.x));
    e.y=Math.max(G.TILE,Math.min((MAP_H-1)*G.TILE,e.y));
  });
}

function checkEnemyContact(){
  if(G.inBattle)return;
  const leader=G.party[0];if(!leader)return;
  for(let i=G.mapEnemies.length-1;i>=0;i--){
    const e=G.mapEnemies[i];if(e.dead)continue;
    if(Math.hypot(leader.x-e.x,leader.y-e.y)<G.TILE*0.75){
      G.mapEnemies.splice(i,1);
      startBattle([e]);
      return;
    }
  }
}

// ============================================================
// RENDER
// ============================================================
const TILE_COLORS={
  [T.FLOOR]:'',// set per-map
  [T.WALL]:'',
  [T.TREE]:'',
  [T.EXIT]:'#aaaa22',
  [T.STAIR_D]:'#553311',
  [T.STAIR_U]:'#553311',
  [T.BOSS_GATE]:'#440022',
  [T.CHEST]:'',
};
const TILE_EMOJI={
  [T.EXIT]:'🚪',[T.STAIR_D]:'🔽',[T.STAIR_U]:'🔼',[T.BOSS_GATE]:'⛩️',
};

function updateCamera(){
  const leader=G.party[0];if(!leader)return;
  const tw=canvas.width,th=canvas.height-120; // controls height
  G.cam.x=leader.x-tw/2;
  G.cam.y=leader.y-th/2;
  const maxX=MAP_W*G.TILE-tw, maxY=MAP_H*G.TILE-th;
  G.cam.x=Math.max(0,Math.min(maxX,G.cam.x));
  G.cam.y=Math.max(0,Math.min(maxY,G.cam.y));
}

function render(){
  const map=MAPS_DEF[G.mapIdx];
  const TILE=G.TILE;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Draw tiles
  const startX=Math.floor(G.cam.x/TILE), startY=Math.floor(G.cam.y/TILE);
  const endX=Math.min(MAP_W,startX+Math.ceil(canvas.width/TILE)+1);
  const endY=Math.min(MAP_H,startY+Math.ceil((canvas.height-120)/TILE)+1);

  for(let ty=startY;ty<endY;ty++){
    for(let tx=startX;tx<endX;tx++){
      const t=G.tiles[ty]?.[tx]; if(t===undefined)continue;
      const sx=tx*TILE-G.cam.x, sy=ty*TILE-G.cam.y;

      // Floor base
      ctx.fillStyle=t===T.WALL?(map.wall||'#3a2a1a'):map.bg;
      ctx.fillRect(sx,sy,TILE,TILE);

      // Tile details
      if(t===T.WALL){
        ctx.fillStyle='rgba(255,255,255,0.04)';ctx.fillRect(sx,sy,TILE,2);
        ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fillRect(sx,sy+TILE-2,TILE,2);
      } else if(t===T.TREE){
        ctx.fillStyle=map.bg;ctx.fillRect(sx,sy,TILE,TILE);
        // Draw tree as circles
        ctx.fillStyle='#1a5a1a';ctx.beginPath();ctx.arc(sx+TILE/2,sy+TILE/2,TILE/2-2,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#2a7a2a';ctx.beginPath();ctx.arc(sx+TILE/2-2,sy+TILE/2-2,TILE/2-5,0,Math.PI*2);ctx.fill();
      } else if(t===T.NPC){
        const npc=G.npcsOnMap.find(n=>n.x===tx&&n.y===ty);
        drawTileEmoji(npc?.icon||'👤',sx,sy,TILE);
      } else if(t===T.EXIT){ctx.fillStyle=TILE_COLORS[t];ctx.fillRect(sx,sy,TILE,TILE);drawTileEmoji('🚪',sx,sy,TILE);}
      else if(t===T.STAIR_D){ctx.fillStyle='#554422';ctx.fillRect(sx,sy,TILE,TILE);drawTileEmoji('🔽',sx,sy,TILE);}
      else if(t===T.STAIR_U){ctx.fillStyle='#554422';ctx.fillRect(sx,sy,TILE,TILE);drawTileEmoji('🔼',sx,sy,TILE);}
      else if(t===T.BOSS_GATE){
        ctx.fillStyle='#440022';ctx.fillRect(sx,sy,TILE,TILE);
        if(G.clearedDungeons[G.mapIdx]){ctx.fillStyle='rgba(0,255,100,0.2)';ctx.fillRect(sx,sy,TILE,TILE);}
        drawTileEmoji('⛩️',sx,sy,TILE);
      }
      else if(t===T.CHEST){
        const ch=G.chests.find(c=>c.x===tx&&c.y===ty);
        drawTileEmoji(ch?.opened?'📭':'🎁',sx,sy,TILE);
      }
    }
  }

  // Grid lines (subtle)
  ctx.strokeStyle='rgba(0,0,0,0.08)';ctx.lineWidth=0.5;
  for(let ty=startY;ty<=endY;ty++){ctx.beginPath();ctx.moveTo(0,ty*TILE-G.cam.y);ctx.lineTo(canvas.width,ty*TILE-G.cam.y);ctx.stroke();}
  for(let tx=startX;tx<=endX;tx++){ctx.beginPath();ctx.moveTo(tx*TILE-G.cam.x,0);ctx.lineTo(tx*TILE-G.cam.x,canvas.height-120);ctx.stroke();}

  // Map enemies
  G.mapEnemies.forEach(e=>{
    if(e.dead)return;
    const sx=e.x-G.cam.x, sy=e.y-G.cam.y;
    const sz=G.TILE*1.1;
    const url=getSpriteURL(e.sprite,e.color,sz);
    const img=getImg(url);
    if(img.complete)ctx.drawImage(img,sx-sz/2,sy-sz/2,sz,sz);
    // HP bar above
    const bw=30,bh=3;
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(sx-bw/2,sy-sz/2-6,bw,bh);
    ctx.fillStyle='#ff4444';ctx.fillRect(sx-bw/2,sy-sz/2-6,bw*(e.curHp/e.hp),bh);
  });

  // Party members
  G.party.forEach((c,i)=>{
    const sx=c.x-G.cam.x, sy=c.y-G.cam.y;
    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(sx,sy+8,10,4,0,0,Math.PI*2);ctx.fill();
    // Character
    ctx.font=`${G.TILE*0.75}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(c.icon,sx,sy-2);
    // Name (leader only)
    if(i===0){
      ctx.font='9px DotGothic16,serif';ctx.fillStyle='rgba(255,255,255,0.85)';
      ctx.fillText(c.name.substr(0,4),sx,sy-G.TILE*0.6);
    }
  });
}

// Image cache for sprites
const imgCache={};
function getImg(url){
  if(!imgCache[url]){const img=new Image();img.src=url;imgCache[url]=img;}
  return imgCache[url];
}
function drawTileEmoji(emoji,sx,sy,size){
  ctx.font=`${size*0.65}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(emoji,sx+size/2,sy+size/2);
}

// Minimap
const mmCanvas=document.getElementById('mm-canvas');
const mmCtx=mmCanvas.getContext('2d');
function drawMinimap(){
  mmCtx.clearRect(0,0,88,88);
  mmCtx.fillStyle='rgba(0,20,0,0.6)';mmCtx.fillRect(0,0,88,88);
  const sx=88/MAP_W,sy=88/MAP_H;
  G.mapEnemies.forEach(e=>{
    if(e.dead)return;
    const ex=e.x/G.TILE*sx,ey=e.y/G.TILE*sy;
    mmCtx.fillStyle='#ff4444';mmCtx.fillRect(ex-1.5,ey-1.5,3,3);
  });
  if(G.party[0]){
    const lx=G.party[0].x/G.TILE*sx,ly=G.party[0].y/G.TILE*sy;
    mmCtx.fillStyle='#00ffaa';mmCtx.beginPath();mmCtx.arc(lx,ly,3,0,Math.PI*2);mmCtx.fill();
  }
}

// ============================================================
// JOYSTICK
// ============================================================
const joyWrap=document.getElementById('joy-wrap');
const joyBase=document.getElementById('joy-base');
const joyKnob=document.getElementById('joy-knob');
const JOY_R=34;

function joyOffset(touch){
  const r=joyBase.getBoundingClientRect();
  return{x:touch.clientX-r.left-r.width/2,y:touch.clientY-r.top-r.height/2};
}
joyWrap.addEventListener('touchstart',e=>{
  e.preventDefault();const t=e.changedTouches[0];
  G.joy={active:true,id:t.identifier,dx:0,dy:0};
},{passive:false});
document.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(G.joy.active&&t.identifier===G.joy.id){
      const o=joyOffset(t);const len=Math.hypot(o.x,o.y);
      const cl=Math.min(len,JOY_R);const ang=Math.atan2(o.y,o.x);
      G.joy.dx=Math.cos(ang)*cl/JOY_R;G.joy.dy=Math.sin(ang)*cl/JOY_R;
      joyKnob.style.transform=`translate(calc(-50% + ${Math.cos(ang)*cl}px),calc(-50% + ${Math.sin(ang)*cl}px))`;
    }
  }
},{passive:false});
document.addEventListener('touchend',e=>{
  for(const t of e.changedTouches){
    if(G.joy.active&&t.identifier===G.joy.id){
      G.joy={active:false,id:-1,dx:0,dy:0};
      joyKnob.style.transform='translate(-50%,-50%)';
    }
  }
});

// Keyboard
window.addEventListener('keydown',e=>{G.keys[e.key]=true;if(e.key==='Enter')handleTalk();});
window.addEventListener('keyup',e=>{G.keys[e.key]=false;});

// BATTLE SYSTEM
// ============================================================
function startBattle(mapEnemies){
  G.inBattle=true; G.isBoss=false; G.battleTurn=0;
  G.waitingForGuest=false; G.guestCmdsReceived=false;
  document.getElementById('battle-bg').style.background=
    'linear-gradient(180deg,#0a1a3a 0%,#1a3a6a 50%,#3a6a2a 50%,#2a4a1a 100%)';

  // 敵をスケール（オンライン時）
  const rawEnemies = mapEnemies.map((e,i)=>({
    ...e, curHp: e.curHp!==undefined ? e.curHp : e.hp, maxHp: e.maxHp||e.hp, idx: i,
  }));
  G.battleEnemies = ONLINE.isOnline ? getScaledEnemyGroup(rawEnemies) : rawEnemies;

  // ホストならバトル開始を P2P でゲストに通知
  if (ONLINE.isOnline && ONLINE.isHost) {
    _syncBattleStart(G.battleEnemies); // 非同期 (await 不要)
  }

  G.pendingLvlUps=[];
  G.cmdQueue=[]; G.cmdSelectIdx=0; G.executing=false;
  document.getElementById('battle-screen').classList.remove('hidden');
  renderBattle();
  const who = ONLINE.isOnline && !ONLINE.isHost ? '🌐 ' : '⚔️ ';
  setBMsg(who + G.battleEnemies.map(e=>e.name).join('と') + ' があらわれた！');
  setTimeout(startCommandSelect, 900);
}

// ====== コマンド選択フェーズ ======
function startCommandSelect(){
  G.executing=false;
  G.cmdQueue=[];
  G.cmdSelectIdx=0;
  selectCommandFor(0);
}

function selectCommandFor(idx){
  const alive=G.party.filter(p=>p.hp>0);
  if(idx>=alive.length){
    showExecuteBtn();
    return;
  }
  G.cmdSelectIdx=idx;
  G.battleActorIdx=G.party.indexOf(alive[idx]);
  const actor=alive[idx];
  renderBattle();
  setBMsg(`${actor.icon} ${actor.name}のコマンドを選んでください`);
  showCmdPhase(true);
  // 「もどる」ボタンは2人目以降のみ表示
  document.getElementById('btn-cmd-back').style.display=idx>0?'':'none';
  document.getElementById('cmd-header-txt').textContent=`${idx+1}人目 / ${alive.length}人`;
}

function cmdBack(){
  // 前のキャラのコマンドを取り消して選び直し
  if(G.cmdSelectIdx<=0) return;
  G.cmdQueue.pop();
  G.cmdSelectIdx--;
  selectCommandFor(G.cmdSelectIdx);
}

function showCmdPhase(on){
  document.getElementById('battle-cmd-phase').style.display=on?'':'none';
  document.getElementById('battle-execute').style.display='none';
  enableCmds(on);
}

function showExecuteBtn(){
  document.getElementById('battle-cmd-phase').style.display='none';
  document.getElementById('battle-execute').style.display='block';
  const labels={attack:'こうげき',spell:'じゅもん',item:'どうぐ',defend:'ぼうぎょ',flee:'にげる'};
  const summary=G.cmdQueue.map(q=>`${q.actor.icon}${labels[q.type]||q.type}`).join('　');
  setBMsg('コマンド確認:\n'+summary+'\n▼ 戦闘開始を押してください');
}

// 現在の選択中スペル（対象選択前に保持）
let pendingSpellIdx=-1;

function bCmd(cmd){
  if(G.executing) return;
  const aliveParty=G.party.filter(p=>p.hp>0);
  const actor=aliveParty[G.cmdSelectIdx];
  if(!actor) return;
  enableCmds(false);

  if(cmd==='spell'){
    openSpellForSelect(actor);
    return;
  }
  if(cmd==='attack'){
    // 攻撃対象を選ぶ
    openTargetSelect(actor, 'attack', -1);
    return;
  }
  // 防御・道具・にげる はそのままキューへ
  G.cmdQueue.push({actor, type:cmd, targetIdx:-1, spellIdx:-1});
  selectCommandFor(G.cmdSelectIdx+1);
}

// ---- 呪文選択 ----
function openSpellForSelect(actor){
  const spells=SPELLS[actor.class]||[];
  document.getElementById('spell-list').innerHTML=spells.map((s,i)=>`
    <button class="spbtn" ${actor.mp<s.mp?'disabled':''} onclick="onSpellSelected(${i})">
      <span>${s.name}<br><span style="font-size:8px;color:var(--white)">${spellTypeLabel(s.type)}</span></span>
      <span class="sp-mp">${s.mp}MP</span>
    </button>`).join('');
  document.getElementById('spell-screen').classList.remove('hidden');
}
function spellTypeLabel(t){
  if(t==='all')return '全体攻撃';
  if(t==='atk')return '単体攻撃';
  if(t==='heal'||t==='heal2'||t==='healfull')return '単体回復';
  if(t==='healall')return '全体回復';
  if(t==='buff')return '強化';
  if(t==='debuff')return '弱体';
  if(t==='multi')return '連続攻撃';
  return '';
}
function onSpellSelected(idx){
  document.getElementById('spell-screen').classList.add('hidden');
  const aliveParty=G.party.filter(p=>p.hp>0);
  const actor=aliveParty[G.cmdSelectIdx];
  const spells=SPELLS[actor.class]||[];
  const spell=spells[idx];
  if(!spell){enableCmds(true);return;}
  pendingSpellIdx=idx;

  // 対象選択が必要か判断
  const needsEnemyTarget=['atk','multi'].includes(spell.type);
  const needsAllyTarget=['heal','heal2','healfull'].includes(spell.type);
  const isAll=['all','healall','buff','debuff'].includes(spell.type);

  if(needsEnemyTarget){
    openTargetSelect(actor, 'spell', idx);
  } else if(needsAllyTarget){
    openAllyTargetSelect(actor, idx);
  } else {
    // 全体 or 特殊 → 対象選択不要
    G.cmdQueue.push({actor, type:'spell', spellIdx:idx, targetIdx:-1});
    selectCommandFor(G.cmdSelectIdx+1);
  }
}
function closeSpell(){
  document.getElementById('spell-screen').classList.add('hidden');
  enableCmds(true);
}

// ---- 敵対象選択 ----
function openTargetSelect(actor, cmdType, spellIdx){
  const alive=G.battleEnemies.filter(e=>e.curHp>0);
  document.getElementById('target-list').innerHTML=alive.map(e=>`
    <button class="tgt-btn" onclick="onTargetSelected(${e.idx}, '${cmdType}', ${spellIdx})">
      <span>${e.name}</span>
      <div class="tgt-hp-bar"><div class="tgt-hp-fill" style="width:${e.curHp/e.maxHp*100}%;background:linear-gradient(90deg,#ff3333,#ff8833);"></div></div>
      <span style="font-size:10px;color:var(--white)">HP ${e.curHp}/${e.maxHp}</span>
    </button>`).join('');
  document.getElementById('target-screen').classList.remove('hidden');
}
function onTargetSelected(targetIdx, cmdType, spellIdx){
  document.getElementById('target-screen').classList.add('hidden');
  const aliveParty=G.party.filter(p=>p.hp>0);
  const actor=aliveParty[G.cmdSelectIdx];
  G.cmdQueue.push({actor, type:cmdType, targetIdx, spellIdx});
  selectCommandFor(G.cmdSelectIdx+1);
}
function closeTargetSelect(){
  document.getElementById('target-screen').classList.add('hidden');
  enableCmds(true);
}

// ---- 味方対象選択（回復） ----
function openAllyTargetSelect(actor, spellIdx){
  document.getElementById('ally-target-list').innerHTML=G.party.map((p,i)=>`
    <button class="tgt-btn" onclick="onAllyTargetSelected(${i}, ${spellIdx})" ${p.hp<=0?'disabled':''}>
      <span>${p.icon} ${p.name}</span>

      <span style="font-size:10px;color:var(--white)">HP ${Math.floor(p.hp)}/${p.maxHp}</span>
