function onAllyTargetSelected(allyIdx, spellIdx){
  document.getElementById('ally-target-screen').classList.add('hidden');
  const aliveParty=G.party.filter(p=>p.hp>0);
  const actor=aliveParty[G.cmdSelectIdx];
  G.cmdQueue.push({actor, type:'spell', spellIdx, targetIdx:-(allyIdx+10)}); // 負値で味方を示す
  selectCommandFor(G.cmdSelectIdx+1);
}
function closeAllyTargetSelect(){
  document.getElementById('ally-target-screen').classList.add('hidden');
  enableCmds(true);
}

// ====== 実行フェーズ ======
function executeTurn(){
  if(G.executing) return;
  document.getElementById('battle-execute').style.display='none';

  // ─── オンライン: ゲストはコマンドを P2P でホストに送って待機 ───
  if(ONLINE.isOnline && !ONLINE.isHost){
    setBMsg('📡 コマンドをパートナーに送信中…');
    _submitGuestCmds(G.cmdQueue).then(()=>{
      setBMsg('⏳ パートナーのターン処理を待っています…');
    });
    return; // ゲストはここで終了。ホストの結果を P2P (battle_result) で受け取る
  }

  // ─── オンライン: ホストは自分のコマンドを保存してゲストを待つ ───
  if(ONLINE.isOnline && ONLINE.isHost){
    G.hostCmdsBackup = [...G.cmdQueue];
    if(G.guestCmdsReceived){
      // すでにゲストのコマンドが届いていたらすぐ実行
      _onGuestCmdsReceived();
    } else {
      G.executing      = false; // onGuestCmdsReceived が true にする
      G.waitingForGuest = true;
      setBMsg('⏳ パートナーのコマンドを待っています…');
      // ホスト側は待機（ゲストのコマンド到着で _onGuestCmdsReceived が呼ばれる）
    }
    return;
  }

  // ─── ソロ: そのまま実行 ───
  _reallyExecuteTurn();
}

// 実際にターンを計算・実行する（ホストのみが呼ぶ）
function _reallyExecuteTurn(){
  G.executing=true;

  // にげる が含まれていたら処理
  const fleeCmd=G.cmdQueue.find(q=>q.type==='flee');
  if(fleeCmd){
    if(Math.random()<0.6){setBMsg('うまく逃げられた！');setTimeout(endBattle,1200);return;}
    else{setBMsg('逃げられなかった！');}
  }

  // 素早さ順にアクター並べる（プレイヤー側コマンド＋敵）
  const actors=[];
  G.cmdQueue.filter(q=>q.type!=='flee').forEach(q=>{
    actors.push({type:'player',ref:q.actor,spd:q.actor.spd,cmd:q});
  });
  G.battleEnemies.filter(e=>e.curHp>0).forEach(e=>{
    actors.push({type:'enemy',ref:e,spd:e.spd||5});
  });
  actors.sort((a,b)=>b.spd-a.spd+((Math.random()-.5)*.5));

  G.execQueue=actors;
  G.execIdx=0;
  G.turnLog=[];  // このターンのログ行を収集
  runNextAction();
}

function runNextAction(){
  if(G.execIdx>=G.execQueue.length){
    // ターン終了: オンライン（ホスト）なら結果を書き込む
    if(ONLINE.isOnline && ONLINE.isHost){
      _syncBattleAfterTurn(G.turnLog || []);
    }
    if(G.battleEnemies.every(e=>e.curHp<=0)){battleVictory();return;}
    if(G.party.every(p=>p.hp<=0)){gameover();return;}
    clearTurnFlags();
    renderBattle();
    setTimeout(startCommandSelect, 600);
    return;
  }

  const act=G.execQueue[G.execIdx++];

  // 既に倒れていたらスキップ
  if(act.type==='player'&&act.ref.hp<=0){runNextAction();return;}
  if(act.type==='enemy'&&act.ref.curHp<=0){runNextAction();return;}

  if(act.type==='player'){
    executePlayerCmd(act.cmd, act.ref);
  } else {
    executeEnemyAction(act.ref);
  }
}

function executePlayerCmd(cmd, actor){
  const alive=G.battleEnemies.filter(e=>e.curHp>0);
  const pIdx=G.party.indexOf(actor);

  if(cmd.type==='defend'){
    actor.defending=true;
    setBMsg(`${actor.name}は身を守っている！\n（このターンのダメージが半減）`);
    setTimeout(runNextAction,1000);
    return;
  }

  if(cmd.type==='attack'){
    if(!alive.length){runNextAction();return;}
    // targetIdx で指定された敵、なければ先頭
    const tgt=alive.find(e=>e.idx===cmd.targetIdx)||alive[0];
    animPlayerAttack(pIdx, tgt.idx, ()=>{
      const dmg=calcDmg(actor.atk+(actor.buffed?Math.floor(actor.atk*.5):0),tgt.def);
      actor.buffed=false;
      applyEnemyDmg(tgt,dmg);
      setBMsg(`${actor.name}の攻撃！\n${tgt.name}に ${dmg} のダメージ！`);
      renderBattle();
      checkBattleEnd(()=>setTimeout(runNextAction,1000));
    });
    return;
  }

  if(cmd.type==='spell'){
    executeSpellCmd(actor, pIdx, cmd.spellIdx, cmd.targetIdx);
    return;
  }

  if(cmd.type==='item'){
    const items=actor.items.filter(i=>i.type==='heal');
    if(!items.length){setBMsg(`${actor.name}は道具がない！`);setTimeout(runNextAction,900);return;}
    const item=items[0];actor.items.splice(actor.items.indexOf(item),1);
    const h=item.value||30;actor.hp=Math.min(actor.maxHp,actor.hp+h);
    showDmg('+'+h,'dc-heal',true,pIdx);
    setBMsg(`${actor.name}が ${item.icon}${item.name} を使った！\nHPが ${h} 回復！`);
    renderBattle();setTimeout(runNextAction,1000);
    return;
  }
}

function executeSpellCmd(actor, pIdx, spellIdx, targetIdx){
  const spells=SPELLS[actor.class]||[];
  const spell=spells[spellIdx];
  if(!spell){runNextAction();return;}
  if(actor.mp<spell.mp){setBMsg(`${actor.name}はMPが足りない！`);setTimeout(runNextAction,900);return;}
  actor.mp-=spell.mp;
  const alive=G.battleEnemies.filter(e=>e.curHp>0);

  // 味方対象（targetIdx < -1: -(allyIdx+10)）
  if(targetIdx<=-10){
    const allyIdx=-(targetIdx+10);
    const healTgt=G.party[allyIdx];
    if(!healTgt){runNextAction();return;}
    const h=spell.type==='healfull'?healTgt.maxHp:Math.floor(actor.int*1.5+(spell.type==='heal2'?30:15)+Math.random()*15);
    healTgt.hp=Math.min(healTgt.maxHp,healTgt.hp+h);
    showDmg('+'+h,'dc-heal',true,allyIdx);
    setBMsg(`${actor.name}が ${spell.name} を唱えた！\n${healTgt.name}のHPが ${h} 回復した！`);
    renderBattle();setTimeout(runNextAction,1100);
    return;
  }

  // 単体敵攻撃
  if(spell.type==='atk'||spell.type==='multi'){
    const t=alive.find(e=>e.idx===targetIdx)||alive[0];
    if(!t){runNextAction();return;}
    if(spell.type==='multi'){
      let tot=0;for(let i=0;i<3;i++){const d=calcDmg(actor.atk,t.def,.7);applyEnemyDmg(t,d);tot+=d;}
      setBMsg(`${actor.name}が ${spell.name}！\n${t.name}に合計 ${tot} のダメージ！`);
    } else {
      const d=calcDmg(actor.int*2,t.def,spell.power);applyEnemyDmg(t,d);
      setBMsg(`${actor.name}が ${spell.name} を唱えた！\n${t.name}に ${d} のダメージ！`);
    }
  }
  // 全体敵攻撃
  else if(spell.type==='all'){
    let msg=`${actor.name}が ${spell.name}！\n`;
    alive.forEach(e=>{const d=calcDmg(actor.int*1.8,e.def,spell.power);applyEnemyDmg(e,d);msg+=`${e.name}に${d}　`;});
    setBMsg(msg);
  }
  // 全体回復
  else if(spell.type==='healall'){
    G.party.forEach((p,i)=>{if(p.hp>0){const h=Math.floor(actor.int+10+Math.random()*10);p.hp=Math.min(p.maxHp,p.hp+h);showDmg('+'+h,'dc-heal',true,i);}});
    setBMsg(`${actor.name}が ${spell.name}！全員が回復した！`);
  }
  // バフ
  else if(spell.type==='buff'){
    actor.buffed=true;setBMsg(`${actor.name}が ${spell.name}！攻撃力が上がった！`);
  }
  else{setBMsg(`${actor.name}が ${spell.name} を唱えた！`);}

  renderBattle();
  checkBattleEnd(()=>setTimeout(runNextAction,1100));
}

function executeEnemyAction(e){
  const partyAlive=G.party.filter(p=>p.hp>0);
  if(!partyAlive.length){gameover();return;}
  const tgt=partyAlive[Math.floor(Math.random()*partyAlive.length)];
  const tgtIdx=G.party.indexOf(tgt);
  animEnemyAttack(e.idx,tgtIdx,()=>{
    let dmg=calcDmg(e.atk,tgt.def);
    if(tgt.defending){dmg=Math.max(1,Math.floor(dmg/2));}
    tgt.hp=Math.max(0,tgt.hp-dmg);
    const defMsg=tgt.defending?' (ぼうぎょ中！)':'';
    setBMsg(`${e.name}の攻撃！\n${tgt.name}に ${dmg} のダメージ！${defMsg}`);
    showDmg(dmg,'dc-hit',true,tgtIdx);
    renderBattle();
    if(G.party.every(p=>p.hp<=0)){setTimeout(gameover,1000);return;}
    setTimeout(runNextAction,1000);
  });
}

function clearTurnFlags(){
  // ターン終了時に防御フラグをリセット
  G.party.forEach(p=>p.defending=false);
}

// 敵全滅チェック（途中で全滅したら即終了）
function checkBattleEnd(cont){
  if(G.battleEnemies.every(e=>e.curHp<=0)){
    setTimeout(battleVictory,800);
  } else {
    cont();
  }
}

// Attack animations
function animPlayerAttack(actorIdx, enemyIdx, cb){
  const allyEl=document.getElementById('bally-spr-'+actorIdx);
  const enmEl=document.getElementById('bspr-'+enemyIdx);
  if(!allyEl){cb();return;}
  allyEl.style.animation='none';void allyEl.offsetWidth;
  allyEl.style.animation='playerAttack .45s ease-in-out forwards';
  setTimeout(()=>{
    if(enmEl){enmEl.style.animation='none';void enmEl.offsetWidth;enmEl.style.animation='enemyHit .35s ease-in-out forwards';}
    allyEl.style.animation='';
    cb();
  },400);
}

function animEnemyAttack(enemyIdx, actorIdx, cb){
  const enmEl=document.getElementById('bspr-'+enemyIdx);
  const allyEl=document.getElementById('bally-spr-'+actorIdx);
  if(!enmEl){cb();return;}
  enmEl.style.animation='none';void enmEl.offsetWidth;
  enmEl.style.animation='enemyAttack .45s ease-in-out forwards';
  setTimeout(()=>{
    if(allyEl){allyEl.style.animation='none';void allyEl.offsetWidth;allyEl.style.animation='hitShake .3s ease-in-out';}
    enmEl.style.animation='';
    cb();
  },400);
}

function renderBattle(){
  const ea=document.getElementById('battle-enemies');
  ea.innerHTML=G.battleEnemies.map((e,i)=>{
    const sz=e.boss?130:90;
    const url=getSpriteURL(e.sprite||'slime',e.color||'#4488ff',sz);
    return`<div class="battle-enemy ${e.curHp<=0?'dead':''}" id="ben-${i}">
      <div class="b-ehp"><div class="b-ehp-fill" id="bhp-${i}" style="width:${e.curHp/e.maxHp*100}%"></div></div>
      <img class="enemy-spr" id="bspr-${i}" src="${url}" width="${sz}" height="${sz}" alt="${e.name}"
        style="image-rendering:pixelated;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5));">
      <div class="b-ename">${e.name} HP:${e.curHp}</div>
    </div>`;
  }).join('');

  const aa=document.getElementById('battle-allies');
  aa.innerHTML=G.party.map((p,i)=>`
    <div class="battle-ally ${p.hp<=0?'dead':''}" id="bally-${i}">
      <div class="ally-spr" id="bally-spr-${i}">${p.icon}</div>
      <div class="ally-name-tag">${p.name}</div>
    </div>`).join('');

  // パーティステータス欄（コマンド選択中のキャラをハイライト）
  const aliveParty=G.party.filter(p=>p.hp>0);
  const curSelectActor=!G.executing&&aliveParty[G.cmdSelectIdx];
  const bp=document.getElementById('battle-party');
  bp.innerHTML=G.party.map((p,i)=>{
    const isCur=p===curSelectActor;
    // 選択済みコマンドを表示
    const queued=G.cmdQueue?.find(q=>q.actor===p);
    const cmdBadge=queued?`<span style="font-size:8px;color:var(--gold);margin-left:4px;">[${queued.type==='attack'?'攻':queued.type==='spell'?'呪':queued.type==='item'?'道':'逃'}]</span>`:'';
    return`<div class="bpc ${isCur?'cur':''}" id="bpc-${i}">
      <div class="bpc-name">${p.icon}${p.name}${cmdBadge}</div>
      <div class="bpc-hp"><span>HP</span><span>${Math.max(0,Math.floor(p.hp))}/${p.maxHp}</span></div>
      <div class="bpc-mp"><span>MP</span><span>${Math.max(0,Math.floor(p.mp))}/${p.maxMp}</span></div>
    </div>`;}).join('');
}

function setBMsg(t){
  document.getElementById('battle-msg').textContent=t;
  // ホストのターン中はログを収集してゲストへ送る
  if(ONLINE.isOnline && ONLINE.isHost && G.executing && t){
    if(!G.turnLog) G.turnLog=[];
    G.turnLog.push(t);
  }
}
function enableCmds(on){['bc-atk','bc-spl','bc-itm','bc-def','bc-fle'].forEach(id=>{const el=document.getElementById(id);if(el)el.disabled=!on;});}

function calcDmg(atk,def,mult=1){return Math.max(1,Math.floor(Math.max(1,atk-Math.floor(def*.5))*(0.85+Math.random()*.3)*mult));}

function applyEnemyDmg(enemy,dmg){
  enemy.curHp=Math.max(0,enemy.curHp-dmg);
  const fill=document.getElementById('bhp-'+enemy.idx);
  if(fill)fill.style.width=(enemy.curHp/enemy.maxHp*100)+'%';
  const el=document.getElementById('ben-'+enemy.idx);
  if(el){el.querySelector('.b-ename').textContent=enemy.name+' HP:'+enemy.curHp;if(enemy.curHp<=0)setTimeout(()=>el.classList.add('dead'),300);}
  showDmg(dmg,'dc-hit',false,enemy.idx);
}

function showDmg(val,cls,isAlly,idx){
  const el=document.createElement('div');
  el.className='dmg-float '+cls;el.textContent=val===0?'MISS':(typeof val==='string'?val:val);
  const bg=document.getElementById('battle-bg').getBoundingClientRect();
  el.style.left=(bg.left+bg.width*(isAlly?(.15+idx*.18):(.35+idx*.2)))+'px';
  el.style.top=(bg.top+bg.height*(isAlly?.72:.32))+'px';
  document.body.appendChild(el);setTimeout(()=>el.remove(),1100);
}

function battleVictory(){
  let totalExp=0,totalGold=0;
  G.battleEnemies.forEach(e=>{totalExp+=e.exp;totalGold+=e.gold;});
  if(G.isBoss){totalExp=Math.floor(totalExp*1.5);totalGold=Math.floor(totalGold*1.5);G.clearedDungeons[G.mapIdx]=true;}
  G.party.forEach(p=>{if(p.hp>0)p.gold=(p.gold||0)+Math.floor(totalGold/G.party.length);});
  setBMsg(`🏆 勝利！\n${totalExp}EXPと${totalGold}Gを手に入れた！`);
  // Item drop
  if(Math.random()<0.35){const item=ITEMS_DROP[Math.floor(Math.random()*ITEMS_DROP.length)];G.party[0].items.push({...item});setTimeout(()=>showItemPop(item),700);}
  setTimeout(()=>{G.party.forEach(p=>{if(p.hp>0){p.exp+=totalExp;checkLvl(p);}});processPendingLvl();},1500);
}

function checkLvl(c){
  while(c.exp>=c.expNext){
    c.lv++;c.exp-=c.expNext;c.expNext=Math.floor(c.expNext*1.6);
    const g={hp:Math.floor(Math.random()*8+5),mp:Math.floor(Math.random()*4+2),atk:Math.floor(Math.random()*3+1),def:Math.floor(Math.random()*2+1)};
    c.maxHp+=g.hp;c.hp=Math.min(c.hp+g.hp,c.maxHp);
    c.baseMaxMp+=g.mp;c.mp=Math.min(c.mp+g.mp,c.maxMp);
    c.baseAtk+=g.atk;c.baseDef+=g.def;recalcStats(c);
    G.pendingLvlUps.push({c,g});
  }
}

function processPendingLvl(){
  if(!G.pendingLvlUps.length){endBattle();return;}
  const{c,g}=G.pendingLvlUps.shift();
  document.getElementById('lu-nm').textContent=c.name;
  document.getElementById('lu-num').textContent=c.lv;
  document.getElementById('lu-stats').innerHTML=`<div>HP <span>+${g.hp}</span></div><div>MP <span>+${g.mp}</span></div><div>攻 <span>+${g.atk}</span></div><div>守 <span>+${g.def}</span></div>`;
  document.getElementById('lvlup-screen').classList.remove('hidden');
}
function closeLvlUp(){document.getElementById('lvlup-screen').classList.add('hidden');processPendingLvl();}

function gameover(){
  G.inBattle=false;
  G.party.forEach(p=>{p.hp=Math.max(1,Math.floor(p.maxHp*.25));});
  setBMsg('😵 全滅してしまった…村に戻った');
  setTimeout(()=>{
    document.getElementById('battle-screen').classList.add('hidden');
    setPlayerPos(12,9);generateMap(0);updatePartyHUD();
    addChat('全滅…村に戻った',null,true);
    G.inBattle=false;startLoop();
  },2000);
}

function endBattle(){
  G.inBattle=false;
  G.waitingForGuest=false;
  G.guestCmdsReceived=false;

  // ホストならバトル終了を P2P でゲストに通知
  if(ONLINE.isOnline && ONLINE.isHost) _syncBattleEnd();

  document.getElementById('battle-screen').classList.add('hidden');
  updatePartyHUD();
  if(G.mapEnemies.length<3) spawnMapEnemy();
  startLoop();
}

// ============================================================
// MAP ACTIONS
// ============================================================
function handleTalk(){
  if(!document.getElementById('dialog').classList.contains('hidden')){advDialog();return;}
  const leader=G.party[0];if(!leader)return;
  const tx=Math.floor(leader.x/G.TILE),ty=Math.floor(leader.y/G.TILE);
  const dirs=[[0,-1],[0,1],[-1,0],[1,0]];
  for(const [dx,dy] of dirs){
    const nx=tx+dx,ny=ty+dy;
    if(G.tiles[ny]?.[nx]===T.NPC){const npc=G.npcsOnMap.find(n=>n.x===nx&&n.y===ny);if(npc){showDialog(npc.id);return;}}
  }
  addChat('話せる相手がそばにいない',null,true);
}
function handleSearch(){
  if(Math.random()<.25){const item=ITEMS_DROP[Math.floor(Math.random()*ITEMS_DROP.length)];G.party[0].items.push({...item});showItemPop(item);}
  else addChat('何も見つからなかった…',null,true);
}

let dialogNpc=null,dialogPage=0;
function showDialog(id){
  const npc=NPCS.find(n=>n.id===id);if(!npc)return;
  dialogNpc=npc;dialogPage=0;
  document.getElementById('dialog-nm').textContent=npc.icon+' '+npc.name;
  document.getElementById('dialog-tx').textContent=npc.dialog[0];
  document.getElementById('dialog').classList.remove('hidden');
}
function advDialog(){
  if(!dialogNpc)return;
  dialogPage++;
  if(dialogPage>=dialogNpc.dialog.length){
    document.getElementById('dialog').classList.add('hidden');
    if(dialogNpc.id==='inn'&&G.party[0].gold>=50){G.party[0].gold-=50;G.party.forEach(p=>{p.hp=p.maxHp;p.mp=p.maxMp;});addChat('宿屋に泊まった。HP・MP全快！',null,true);}
    dialogNpc=null;return;
  }
  document.getElementById('dialog-tx').textContent=dialogNpc.dialog[dialogPage];
}
canvas.addEventListener('click',advDialog);

function openChestAt(tx,ty){
  const ch=G.chests.find(c=>c.x===tx&&c.y===ty);
  if(!ch||ch.opened)return;
  ch.opened=true;
  const r=Math.random();
  if(r<.4){const g=20+Math.floor(Math.random()*60)+G.dungeonFloor*15;G.party[0].gold+=g;addChat('🎁 '+g+'ゴールドを見つけた！',null,true);}
  else if(r<.7){const item=ITEMS_DROP[Math.floor(Math.random()*ITEMS_DROP.length)];G.party[0].items.push({...item});showItemPop(item);}
  else{const tier=Math.min(G.mapIdx,5);const pool=EQUIP_CATALOG.filter(e=>e.price<=1500*(tier+1));const e=(pool.length?pool:EQUIP_CATALOG)[Math.floor(Math.random()*(pool.length?pool.length:EQUIP_CATALOG.length))];if(!G.party[0].inventory.includes(e.id))G.party[0].inventory.push(e.id);showItemPop({icon:e.icon,name:e.name});}
}

function resetJoy(){
  G.joy={active:false,id:-1,dx:0,dy:0};
  joyKnob.style.transform='translate(-50%,-50%)';
}
function changeMap(idx){
  if(idx>=MAPS_DEF.length)idx=0;
  fadeIn(()=>{G.prevMapIdx=G.mapIdx;G.dungeonFloor=0;generateMap(idx);addChat('📍 '+MAPS_DEF[idx].name+'に移動した',null,true);});
}
function descendFloor(){
  const map=MAPS_DEF[G.mapIdx];G.dungeonFloor++;
  fadeIn(()=>{generateMap(G.mapIdx);const last=G.dungeonFloor===map.floors-1;addChat(last?'⚠️ 最深部…強大な気配！':'🔽 地下'+(G.dungeonFloor+1)+'階',null,true);});
}
function ascendFloor(){
  if(G.dungeonFloor<=0){changeMap(G.prevMapIdx);return;}
  G.dungeonFloor--;fadeIn(()=>{generateMap(G.mapIdx);addChat('🔼 地下'+(G.dungeonFloor+1)+'階に戻った',null,true);});
}
function fadeIn(cb){
  G.transitioning=true;
  const t=document.getElementById('transition');t.classList.add('in');
  setTimeout(()=>{cb();resetJoy();setTimeout(()=>{t.classList.remove('in');G.transitioning=false;},350);},350);
}

// ============================================================
// STATS / EQUIP
// ============================================================
function recalcStats(c){
  if(!c.baseAtk&&c.baseAtk!==0)return;
  let b={atk:0,def:0,spd:0,int:0,maxMp:0};
  for(const slot of['weapon','armor','accessory']){const id=c.equip[slot];if(!id)continue;const e=getEquip(id);if(!e)continue;b.atk+=e.atk||0;b.def+=e.def||0;b.spd+=e.spd||0;b.int+=e.int||0;b.maxMp+=e.maxMp||0;}
  c.atk=Math.max(1,c.baseAtk+b.atk);c.def=Math.max(0,c.baseDef+b.def);c.spd=Math.max(1,c.baseSpd+b.spd);c.int=Math.max(1,c.baseInt+b.int);c.maxMp=c.baseMaxMp+b.maxMp;if(c.mp>c.maxMp)c.mp=c.maxMp;
}

// ============================================================
// PARTY HUD
// ============================================================
function updatePartyHUD(){
  document.getElementById('party-hud').innerHTML=G.party.map(p=>`
    <div class="hud-card">
      <div class="hud-icon">${p.icon}</div>
      <div class="hud-bars">
        <div class="hud-name">${p.name} Lv.${p.lv}</div>
        <div class="bar-row"><span class="bar-lbl">HP</span><div class="bar-track"><div class="bar-hp" style="width:${Math.max(0,p.hp/p.maxHp*100)}%"></div></div></div>
        <div class="bar-row"><span class="bar-lbl">MP</span><div class="bar-track"><div class="bar-mp" style="width:${Math.max(0,p.mp/p.maxMp*100)}%"></div></div></div>
      </div>
      <div class="hud-lv">${Math.floor(p.hp)}/${p.maxHp}</div>
    </div>`).join('');
}

// ============================================================
// MENU / STATUS / EQUIP
// ============================================================
function openMenu(){
  document.getElementById('menu-screen').classList.remove('hidden');
  document.getElementById('menu-online-btn').style.display=ONLINE.isOnline?'':'none';
}
function closeMenu(){document.getElementById('menu-screen').classList.add('hidden');}
function openStatus(){closeMenu();
  const c=G.party[0];
  document.getElementById('st-ico').textContent=c.icon;
  document.getElementById('st-nm').textContent=c.name;
  document.getElementById('st-cl').textContent=CLASSES[c.class].name+' · Lv.'+c.lv;
  document.getElementById('st-grid').innerHTML=`
    <div class="sg-item"><div class="sg-lbl">HP</div><div class="sg-val" style="color:#ff8888">${Math.floor(c.hp)}/${c.maxHp}</div></div>
    <div class="sg-item"><div class="sg-lbl">MP</div><div class="sg-val" style="color:#99bbff">${Math.floor(c.mp)}/${c.maxMp}</div></div>
    <div class="sg-item"><div class="sg-lbl">こうげき</div><div class="sg-val">${c.atk}</div></div>
    <div class="sg-item"><div class="sg-lbl">しゅび</div><div class="sg-val">${c.def}</div></div>
    <div class="sg-item"><div class="sg-lbl">すばやさ</div><div class="sg-val">${c.spd}</div></div>
    <div class="sg-item"><div class="sg-lbl">かしこさ</div><div class="sg-val">${c.int}</div></div>
    <div class="sg-item"><div class="sg-lbl">けいけん</div><div class="sg-val">${c.exp}/${c.expNext}</div></div>
    <div class="sg-item"><div class="sg-lbl">ゴールド</div><div class="sg-val" style="color:var(--gold)">${c.gold}G</div></div>`;
  document.getElementById('status-screen').classList.remove('hidden');
}
function closeStatus(){document.getElementById('status-screen').classList.add('hidden');}
function menuItem(){closeMenu();const items=G.party[0].items;addChat(items.length?'どうぐ: '+items.map(i=>i.icon+i.name).join(' '):'どうぐがない',null,true);}

let eqSlot='weapon';
function menuEquip(){closeMenu();eqSlot='weapon';renderEquip();document.getElementById('equip-screen').classList.remove('hidden');}
function closeEquip(){document.getElementById('equip-screen').classList.add('hidden');}
const SLOT_LBL={weapon:'ぶき',armor:'よろい',accessory:'そうしょく'};
function renderEquip(){
  const c=G.party[0];
  document.getElementById('eq-slots').innerHTML=['weapon','armor','accessory'].map(s=>{
    const id=c.equip[s];const e=id?getEquip(id):null;
    const stat=e?[e.atk&&'攻+'+e.atk,e.def&&'守+'+e.def].filter(Boolean).join(' '):'';
    return`<button class="eqslot ${eqSlot===s?'cur':''}" onclick="selEqSlot('${s}')">
      <span class="eq-stype">${SLOT_LBL[s]}</span><span class="eq-sico">${e?e.icon:'➖'}</span>
      <span class="eq-snm ${e?'':'eq-empty'}">${e?e.name:'なし'}</span>
      <span class="eq-sstat">${stat}</span></button>`;}).join('');
  document.getElementById('eq-stats').innerHTML=`<span class="eq-chip">攻<b>${c.atk}</b></span><span class="eq-chip">守<b>${c.def}</b></span><span class="eq-chip">速<b>${c.spd}</b></span>`;
  document.getElementById('eq-list-lbl').textContent=SLOT_LBL[eqSlot]+'を選ぶ';
  const owned=c.inventory.map(getEquip).filter(e=>e&&e.slot===eqSlot);
  const curId=c.equip[eqSlot];
  document.getElementById('eq-list').innerHTML=
    `<button class="eqitem" onclick="equipItm(null)"><span class="eq-sico">➖</span><span class="eq-snm">はずす</span></button>`+
    owned.map(e=>{
      const cur=curId?getEquip(curId):null;
      const da=(e.atk||0)-(cur?.atk||0),dd=(e.def||0)-(cur?.def||0);
      const delta=[da&&`<span class="${da>0?'dplus':'dminus'}">攻${da>0?'+':''}${da}</span>`,dd&&`<span class="${dd>0?'dplus':'dminus'}">守${dd>0?'+':''}${dd}</span>`].filter(Boolean).join(' ');
      return`<button class="eqitem ${e.id===curId?'equipped':''}" onclick="equipItm('${e.id}')">
        <span class="eq-sico">${e.icon}</span><span class="eq-snm">${e.name}</span>
        <span class="eq-delta">${delta}</span>${e.id===curId?'<span class="eq-badge">装備中</span>':''}</button>`;}).join('');
}
function selEqSlot(s){eqSlot=s;renderEquip();}
function equipItm(id){
  const c=G.party[0];c.equip[eqSlot]=id;recalcStats(c);
  addChat((id?getEquip(id).icon+getEquip(id).name+'を装備！':'はずした'),null,true);
  renderEquip();updatePartyHUD();
}

// ============================================================
// ITEM POPUP / CHAT
// ============================================================
function showItemPop(item){
  document.getElementById('ip-ico').textContent=item.icon;
  document.getElementById('ip-nm').textContent=item.name;
  const el=document.getElementById('item-popup');
  el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2500);
}
function addChat(msg,name,sys=false){
  const box=document.getElementById('chatbox');
  const el=document.createElement('div');el.className='chat-line';
  el.innerHTML=sys?`<span class="chat-sys">${msg}</span>`:`<span class="chat-name">${name}:</span> ${msg}`;
  box.appendChild(el);while(box.children.length>4)box.removeChild(box.firstChild);
  setTimeout(()=>el.remove(),6000);
}
function openChatInput(){document.getElementById('chat-input').classList.remove('hidden');document.getElementById('chat-txt').focus();}
function closeChatInput(){document.getElementById('chat-input').classList.add('hidden');}
function sendChat(){const t=document.getElementById('chat-txt').value.trim();if(!t)return;addChat(t,G.party[0].name);document.getElementById('chat-txt').value='';closeChatInput();}
document.getElementById('chat-txt').addEventListener('keypress',e=>{if(e.key==='Enter')sendChat();});

// ============================================================
// ズームリセット（iOSキーボードを閉じたときに元のスケールに戻す）
// ============================================================
function resetZoom(){
  // viewportのscaleを強制的に1.0にリセット
  const mv = document.querySelector('meta[name="viewport"]');
  if(!mv) return;
  mv.setAttribute('content','width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover');
}
// inputからフォーカスが外れたときにリセット
document.addEventListener('focusout', e => {
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
    setTimeout(resetZoom, 100);
    // スクロール位置もトップに戻す
    setTimeout(() => window.scrollTo(0, 0), 150);
  }
});
</script>
</body>
